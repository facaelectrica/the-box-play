<script type="module">
import * as THREE from 'three';

// ================= settings (Options) =================
function pct(v) { return Math.round(v * 100) + '%'; }
const OPTS = [
  { grp: 'The figure' },
  { k: 'push', label: 'Finger push', min: 0, max: 2, step: 0.05, def: 1, fmt: pct, help: 'How hard your finger pushes him when you touch him.' },

  { k: 'view', label: 'View depth', min: 0, max: 1.5, step: 0.01, def: 0.3, fmt: pct, help: 'How much the view shifts as you turn the phone.' },
  { k: 'viewReturn', label: 'View re-centre', min: 0.5, max: 12, step: 0.1, def: 3, fmt: v => v.toFixed(1) + ' s', help: 'How fast the view settles back after you turn.' },
  { grp: 'Look and sound' },

const SET = {};
const STORE = 'thebox.settings.v4';
function loadSettings() {
  for (const o of OPTS) if (o.k) SET[o.k] = o.def;
  try { Object.assign(SET, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (_) {}
}

loadSettings();

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const DARK = new THREE.Color(0x1a120b), ROOM = new THREE.Color(0x7d7368), GREY = new THREE.Color(0x808080);
scene.background = DARK;
const camera = new THREE.PerspectiveCamera();
scene.add(camera);

// ================= dimensions (world units; the screen's short side = 2) =================
const D = 2.34;      // box depth: room to turn round and get up
const LIP = 0.07;    // wall thickness at the rim
const EYE = 5.2;     // viewing distance
let hw, hh, ix, iy;

// ================= procedural wood =================
// Each board is drawn as a real cut through a log: the growth rings are cylinders around the pith, the board's face
// cuts them at a slight angle, so they show as nested arches ("cathedrals") with straight grain at the edges.
// Earlywood is light, latewood darker with a sharp edge into the next year's ring; fine pores run along the grain;
// knots push the rings round them. Drawn once per surface on the GPU, read back into a canvas (fast enough to redo
// when the screen turns). The same seed gives the same boards, so the wood doesn't change when the box is rebuilt.
const PX = 320;   // texels per world unit
const WOOD_SEED = Math.floor(Math.random() * 997);
const WOOD_GLSL = /* glsl */`
precision highp float;
uniform vec2 uSize; uniform float uPX, uAlong, uPlanks, uSeed, uMode, uSeams, uKnots, uTilt;
uniform vec3 uE, uL; uniform float uVar;
float h11(float p) { p = fract(p * .1031); p *= p + 33.33; p *= p + p; return fract(p); }
float h21(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vn(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 17.1; a *= .5; } return s - .47; }
void main() {
  vec2 c = gl_FragCoord.xy;   // read back bottom row first, so this is the canvas pixel, top row first
  vec2 b = (uAlong > .5 ? c : c.yx) / uPX;                           // board: x along the grain, y across
  float W = (uAlong > .5 ? uSize.y : uSize.x) / uPX, Lb = (uAlong > .5 ? uSize.x : uSize.y) / uPX;
  float pw = W / uPlanks, p = min(floor(b.y / pw), uPlanks - 1.), v = b.y - p * pw, u = b.x;
  float s = uSeed + p * 17.31;
  float r1 = h11(s + .1), r2 = h11(s + .2), r3 = h11(s + .3), r4 = h11(s + .4), r5 = h11(s + .5), r6 = h11(s + .6);
  // the log: pith beside/under the board, its depth below the face changing along the board (that makes the arches)
  float rf = mix(38., 58., r1);                                       // rings per unit
  float pc = pw * (.5 + (r2 - .5) * 1.3);
  float tilt = mix(.08, .18, r4) * uTilt;
  float along = r5 < .5 ? u : Lb - u;                                 // arches point up or down the board
  float uu = u + r6 * 40.;
  float dz = mix(.05, .55, r3 * r3) + tilt * along + .07 * sin(uu * .6 + r6 * 6.) + .08 * fbm(vec2(uu * .3, s));
  float dx = v - pc + .06 * fbm(vec2(uu * .45, v * 1.5 + s));
  float r = sqrt(dx * dx + dz * dz);
  r += .005 * fbm(vec2(uu * 1.5, v * 5. + s * 3.)) + .0012 * vn(vec2(uu * 10., v * 40.));
  // knots: the rings swell round them; a dark core with its own little rings
  float knot = 0.;
  for (int k = 0; k < 2; k++) {
    float q = s + float(k) * 3.7;
    if (h11(q + .7) > uKnots) continue;
    vec2 kp = vec2(h11(q + .8) * Lb, mix(.15, .85, h11(q + .9)) * pw);
    float ks = mix(.012, .028, h11(q + 1.1));
    vec2 d = (vec2(u, v) - kp) / vec2(ks * 4.5, ks * 1.7);
    r += mix(2.5, 5., h11(q + 1.3)) / rf * exp(-.5 * dot(d, d));
    float e = length((vec2(u, v) - kp) / vec2(ks * 1.25, ks));
    knot = max(knot, (1. - smoothstep(.6, 1.05, e)) * (.85 + .15 * sin(e * 12.)));
  }
  float x = r * rf, f = fract(x), id = floor(x);
  float ri = mix(.25, 1., pow(h11(id * 1.37 + s), 1.5));                          // some years darker than others
  float late = smoothstep(.55, .97, f); late *= late; late *= 1. - smoothstep(.975, 1., f);
  late *= ri;
  // pores and fibres, along the grain
  float por = vn(vec2(u * 3., v * 110.)), dash = smoothstep(.7, .95, vn(vec2(u * 7., v * 140.)));
  float big = fbm(vec2(u * .55, v * 1.6 + s));
  // seams between boards
  float de = min(v, pw - v) * uPX;
  float seam = 0., lip = 0.;
  if (uSeams > .5 && uPlanks > 1.) {
    bool inner = (v < pw * .5 && p > 0.) || (v >= pw * .5 && p < uPlanks - 1.);
    if (inner) { seam = 1. - smoothstep(.5, 1.6, de); lip = smoothstep(1.2, 2., de) * (1. - smoothstep(2., 5., de)); }
  }
  if (uMode > .5) {                                                    // height, for the bump map
    float hgt = .62 - .16 * late - .22 * dash - .1 * por + .08 * big - .25 * knot;
    hgt = mix(hgt, .05, seam) - .04 * lip;
    gl_FragColor = vec4(vec3(clamp(hgt, 0., 1.)), 1.);
    return;
  }
  vec3 tint = vec3(1. + uVar * (r1 - .5), 1. + uVar * .8 * (r1 - .5) - .04 * (r2 - .5), 1. + uVar * (r3 - .5) * 1.5);
  vec3 E = uE * tint * (1. + .1 * (r4 - .5));
  vec3 L = uL * tint;
  vec3 col = mix(E, L, late * .75);
  col *= 1. + .18 * big;
  col *= 1. - .06 * por - .09 * dash * (.4 + late);
  col = mix(col, L * .5, knot * .85);
  col *= 1. - .78 * seam;
  col *= 1. - .1 * lip;
  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;
const bakeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), bakeScene = new THREE.Scene();
const bakeMat = new THREE.ShaderMaterial({
  vertexShader: 'void main() { gl_Position = vec4(position.xy, 0., 1.); }', fragmentShader: WOOD_GLSL, depthTest: false,
  uniforms: { uSize: { value: new THREE.Vector2() }, uPX: { value: PX }, uAlong: { value: 1 }, uPlanks: { value: 1 }, uSeed: { value: 0 },
    uMode: { value: 0 }, uSeams: { value: 1 }, uKnots: { value: .4 }, uTilt: { value: 1 }, uE: { value: new THREE.Color() }, uL: { value: new THREE.Color() }, uVar: { value: .1 } }
});
bakeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bakeMat));
function bakeWood(w, h, alongX, opt, mode) {
  const U = bakeMat.uniforms;
  U.uSize.value.set(w, h); U.uAlong.value = alongX ? 1 : 0; U.uPlanks.value = opt.planks || 1; U.uSeed.value = opt.seed || 0;
  U.uMode.value = mode; U.uSeams.value = opt.seams === false ? 0 : 1; U.uKnots.value = opt.knots ?? .4; U.uTilt.value = opt.tilt ?? 1;
  U.uE.value.setStyle(opt.light, THREE.NoColorSpace); U.uL.value.setStyle(opt.dark, THREE.NoColorSpace); U.uVar.value = opt.tintVar;
  const rt = new THREE.WebGLRenderTarget(w, h, { depthBuffer: false });
  const prev = renderer.getRenderTarget();
  renderer.setRenderTarget(rt); renderer.render(bakeScene, bakeCam);
  const buf = new Uint8ClampedArray(w * h * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, w, h, buf);
  renderer.setRenderTarget(prev); rt.dispose();
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').putImageData(new ImageData(buf, w, h), 0, 0);
  return c;
}
// ao: corner darkening per edge, canvas orientation (top = the plane's +y)
function woodTexture(worldW, worldH, alongX, opt, ao) {
  const maxT = Math.min(4096, renderer.capabilities.maxTextureSize);
  const w = clamp(Math.round(worldW * PX), 64, maxT), h = clamp(Math.round(worldH * PX), 64, maxT);
  const bump = new THREE.CanvasTexture(bakeWood(w, h, alongX, opt, 1));
  const c = bakeWood(w, h, alongX, opt, 0), g = c.getContext('2d');
  const aoW = 0.28 * PX;
  const edge = (x0, y0, x1, y1, s, rx, ry, rw, rh) => {
    if (!s) return;
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, `rgba(20,10,3,${s})`); gr.addColorStop(1, 'rgba(20,10,3,0)');
    g.fillStyle = gr; g.fillRect(rx, ry, rw, rh);
  };
  edge(0, 0, 0, aoW, ao.top, 0, 0, w, aoW);
  edge(0, h, 0, h - aoW, ao.bottom, 0, h - aoW, w, aoW);
  edge(0, 0, aoW, 0, ao.left, 0, 0, aoW, h);
  edge(w, 0, w - aoW, 0, ao.right, w - aoW, 0, aoW, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = bump.anisotropy = renderer.capabilities.getMaxAnisotropy();

let actx = null;
// The figure's sounds: only when a part meets the wood, soft and muffled, like a person in a wooden box. A foot landing
// is a soft heel-then-sole step; a hand is a light pat; knees, elbows, head and body land with a dull thump (the

  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 4; comp.attack.value = 0.002; comp.release.value = 0.12;

  let br = 0; for (let i = 0; i < len; i++) { br = 0.9 * br + 0.1 * (Math.random() * 2 - 1); d[i] = br * 2.5; }   // soft, dark noise

// the parts' touches on the wood, read from MuJoCo's contacts: a part sounds when it arrives on a wall
const SND_KIND = n => /Foot|ToeBase/.test(n) ? 'foot' : /Hand/.test(n) ? 'hand' : /Arm|Shin|Leg|Shoulder|Neck/.test(n) ? 'limb' : 'body';

function sfxUpdate(dt) {
  const d = W.d, m = W.m;

  const vel = {};

    const b = W.bodyId[n], p = [d.xpos[3 * b], d.xpos[3 * b + 1], d.xpos[3 * b + 2]], q = prevPos[n];
    vel[n] = q && dt > 0 ? [(p[0] - q[0]) / dt, (p[1] - q[1]) / dt, (p[2] - q[2]) / dt] : [0, 0, 0];
    prevPos[n] = p;

  SFX.recent = SFX.recent.filter(x => now - x < 120);
  // which parts touch a wall now, and along which normal (out of the wall)
  const touch = {};
  const isWall = g => W.isFig[m.geom_bodyid[g]] === 0;
  for (let i = 0; i < d.ncon; i++) {
    const c = d.contact.get(i);

  }
}

$('look').onclick = e => {
  e.stopPropagation();
  look.on = !look.on; $('look').classList.toggle('on', look.on);
  $('pose').style.display = look.on ? 'block' : 'none';
  if (!look.on && poseIdx !== 0) standUp();   // physics carries on from standing, not from a test pose
  poseIdx = 0; $('pose').classList.remove('on');
  if (look.on) {
    standUp();
    const p = bodyPoint('Hips'), h = bodyPoint('Head');
    look.tgt.copy(p).lerp(h, 0.25);
    look.yaw = 0; look.pitch = 0.1; look.dist = 1.75 * S * 1.75;
    poke.on = false; drag = null;
    note('Paused. Slide to look around him; tap the circle to carry on.', 2600);
  } else { acc = 0; last = performance.now(); }
  applyPlaceVis();   // looking him over: a plain 50% grey behind him, no box or floor
};
for (const ev of ['pointerdown', 'pointerup']) $('look').addEventListener(ev, e => e.stopPropagation());
// test poses in look mode (user, 12:43: "a new button below for poses ... so we can test how it looks in the
// extremes"): each tap puts him in the next pose of sim/poses.js (sitting, star, bending to pick up, squat, lunge,
// reaching up twisting, back to standing); physics stays paused
let poseIdx = 0;
$('pose').onclick = e => {
  e.stopPropagation();
  if (!look.on) return;
  poseIdx = (poseIdx + 1) % POSES.length;
  applyPose(W, mj, POSES[poseIdx], brain ? BRAIN_STAND : STAND);
  syncFigure();
  const p = bodyPoint('Hips'), h = bodyPoint('Head');
  look.tgt.copy(p).lerp(h, 0.25);
  $('pose').classList.toggle('on', poseIdx !== 0);
  note(POSES[poseIdx].label, 1500);
};
for (const ev of ['pointerdown', 'pointerup']) $('pose').addEventListener(ev, e => e.stopPropagation());
el.addEventListener('pointerdown', e => { if (look.on) look.drag = { x: e.clientX, y: e.clientY, yaw: look.yaw, pitch: look.pitch, id: e.pointerId }; }, true);
el.addEventListener('pointermove', e => {
  if (!look.on || !look.drag || e.pointerId !== look.drag.id) return;
  const k = Math.PI / Math.min(innerWidth, innerHeight);
  look.yaw = look.drag.yaw - (e.clientX - look.drag.x) * k * 1.2;
  look.pitch = clamp(look.drag.pitch + (e.clientY - look.drag.y) * k, -1.2, 1.35);
}, true);
el.addEventListener('pointerup', e => { if (look.on) look.drag = null; }, true);
function lookCamera() {
  const c = Math.cos(look.pitch);
  camera.position.set(look.tgt.x + look.dist * c * Math.sin(look.yaw), look.tgt.y + look.dist * Math.sin(look.pitch), look.tgt.z + look.dist * c * Math.cos(look.yaw));
  camera.up.set(0, 1, 0); camera.lookAt(look.tgt); camera.updateMatrixWorld();
  const n = 0.05, top = n * Math.tan(25 * DEG), right = top * hw / hh;   // a 50-degree view
  camera.projectionMatrix.makePerspective(-right, right, top, -top, n, 40);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}

// ================= the loop =================
let acc = 0, last = performance.now(), frameN = 0;
const lu = new THREE.Vector3();
const calmG = makeCalmGravity();
async function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  // which way is down? (in g, screen axes; shakes included)
  let gx, gy, gz;
  if (mode === 'sensor') {
    gS.lerp(gRaw, 1 - Math.pow(SET.smooth, dt * 60));
    gx = gS.x; gy = gS.y; gz = gS.z;
  } else {
    const a = Math.min(1, dt * 10);
    dragS.roll += (dragRot.roll - dragS.roll) * a; dragS.pitch += (dragRot.pitch - dragS.pitch) * a;
    gx = Math.sin(dragS.roll) * Math.cos(dragS.pitch);
    gy = -Math.cos(dragS.roll) * Math.cos(dragS.pitch);
    gz = -Math.sin(dragS.pitch);
  }
  // real gravity, 9.81 m/s2, in MuJoCo's axes (x right, y into the box, z up)
  // calmed (sim/brain.js makeCalmGravity): the accelerometer's tremor and noise made him shuffle (user, v15.2)
  W.setGravity(calmG([gx * 9.81, -gz * 9.81, gy * 9.81], dt));
  // the room's light stays up
  const gl = Math.hypot(gx, gy, gz) || 1;
  lu.set(-gx / gl, -gy / gl, -gz / gl);
  lightUp.lerp(lu, Math.min(1, dt * 4)).normalize();
  placeLight();

  // physics in real time, in small steps
  acc += look.on ? 0 : dt;
  let n = 0;
  const nMax = Math.round(0.034 / PHYS.dt);
  while (acc >= PHYS.dt && n < nMax) {
    if (poke.on) poke.t += PHYS.dt;
    fingerPush();
    testKick();
    if (brain && control === brain.control && brain.due()) {
      await brain.think();   // the network, 30 times a second
      if (brain.down && !brain.told) { brain.told = true; note("He can't get up on his own yet. Double-tap to stand him up.", 3500); }
    }
    W.step(control);
    AUDIT.check();
    acc -= PHYS.dt; n++;
  }
  if (n === nMax) acc = 0;   // a slow phone: let time slip rather than fall behind
  sfxUpdate(dt);
  syncFigure();

  if (look.on) lookCamera(); else updateCamera(dt);
  // bounce light: redrawn only when the light has moved
  frameN++;
  if (envDirty < 2 || (lightUp.angleTo(envUp) > 4 * DEG && frameN - envFrame > 12)) { updateEnv(); envDirty++; envUp.copy(lightUp); envFrame = frameN; }
  renderer.render(scene, camera);
  adaptSharpness(dt);
  requestAnimationFrame(frame);
}

// ================= start =================
$('go').disabled = false; $('go').textContent = 'Start';
$('go').onclick = async () => {
  goFull();
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); await actx.resume(); } catch (_) { actx = null; }
  for (const Ev of [window.DeviceOrientationEvent, window.DeviceMotionEvent]) {
    try { if (Ev && typeof Ev.requestPermission === 'function') await Ev.requestPermission(); } catch (_) {}
  }
  window.addEventListener('deviceorientation', onOrientation);
  window.addEventListener('devicemotion', onMotion);
  $('start').classList.add('hide');
  $('hud').classList.add('show');
  fullSync();
  setTimeout(() => { if (mode !== 'sensor') { mode = 'touch'; note('No motion sensors here, so drag to turn the box.', 4500); } }, 1300);
};

// a resize (the phone's bars, the address bar) only reshapes the box: he carries on where he is
let reshapeT = 0;
addEventListener('resize', () => { resizeAll(); clearTimeout(reshapeT); reshapeT = setTimeout(() => buildBox(), 250); });
buildOptions();
buildBox();
buildFigure();
standUp();
applyQuality();
requestAnimationFrame(frame);
</script>
