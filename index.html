<!DOCTYPE html>
<html lang="en">
<head>

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a120b;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f5e8d6}
  canvas{display:block;width:100%;height:100%}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(22,14,8,.74);text-align:center;padding:24px;z-index:5;transition:opacity .4s}
  #start.hide{opacity:0;pointer-events:none}
  #start h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.2px}
  #start p{margin:0;max-width:300px;line-height:1.45;opacity:.85;font-size:15px}
  #go{margin-top:10px;font:inherit;font-size:18px;font-weight:700;padding:15px 40px;border-radius:999px;border:0;background:#eab873;color:#2a1a0c;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #hud{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:2;pointer-events:none;opacity:0;transition:opacity .5s}
  #hud.show{opacity:1}
  .pill{pointer-events:auto;background:rgba(28,18,10,.62);color:#f5e8d6;border:1px solid rgba(255,230,200,.2);border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #note{position:fixed;left:50%;top:calc(22px + env(safe-area-inset-top));transform:translateX(-50%);z-index:2;max-width:82%;text-align:center;font-size:13px;line-height:1.4;background:rgba(28,18,10,.7);border:1px solid rgba(255,230,200,.2);border-radius:14px;padding:9px 14px;opacity:0;transition:opacity .6s;pointer-events:none}
  #note.show{opacity:1}
  #look{position:fixed;right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));z-index:6;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,235,205,.85);background:rgba(28,18,10,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:0;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  #look::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:rgba(255,235,205,.9)}
  #look.on{background:#ffd400;border-color:#ffd400}#look.on::after{background:#111;width:10px;height:10px;border-radius:2px}
  #ver{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));z-index:6;font-size:16px;font-weight:800;letter-spacing:.5px;color:#111;background:#ffd400;border-radius:8px;padding:4px 10px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.45)}
  #opts{position:fixed;left:0;right:0;bottom:0;z-index:4;max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(24,16,9,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid rgba(255,230,200,.18);border-radius:18px 18px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s ease}
  #opts.open{transform:none}
  #opts .head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;background:rgba(24,16,9,.96);z-index:1}
  #opts .head b{font-size:17px}
  #opts .grp{margin:14px 0 2px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55}
  .row{padding:9px 0;border-bottom:1px solid rgba(255,230,200,.08)}
  .row .top{display:flex;justify-content:space-between;font-size:14px}
  .row .top span:last-child{opacity:.75;font-variant-numeric:tabular-nums}
  .row .help{font-size:12px;opacity:.55;margin-top:3px}
  .row input[type=range]{width:100%;margin:8px 0 0;accent-color:#eab873;height:28px}
  .row.tog{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .sw{flex:none;width:50px;height:30px;border-radius:999px;border:0;background:rgba(255,255,255,.18);position:relative}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#f5e8d6;transition:left .2s}
  .sw.on{background:#eab873}.sw.on::after{left:23px}
  .btns{display:flex;gap:8px;margin-top:16px}
  .btns button{flex:1}
</style>

<body>
<div id="start">
  <h1>The Box</h1>
  <p>Your screen is the glass front of a wooden box with a little figure inside. Hold the phone upright and it stands. Turn, tilt and shake the box, and watch it try to keep its balance. Touch him to push him. Double-tap an empty spot to stand him up again.</p>
  <button id="go" disabled>Loading…</button>
</div>
<div id="ver">v13.2</div>
<button id="look" aria-label="Freeze and look around"></button>
<div id="note"></div>
<div id="hud">
  <button class="pill" id="optBtn">Options</button>
  <button class="pill" id="full">Full screen</button>
</div>
<div id="opts">
  <div class="head"><b>Options</b><button class="pill" id="optClose">Done</button></div>
  <div id="optRows"></div>
  <div class="btns">
    <button class="pill" id="resetFig">Stand it up again</button>
    <button class="pill" id="resetVals">Default values</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import * as CANNON from 'cannon-es';
import initJolt from 'https://cdn.jsdelivr.net/npm/jolt-physics@1.1.1/dist/jolt-physics.wasm-compat.js';

const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;
const clamp = THREE.MathUtils.clamp;

// ================= settings (Options) =================
function pct(v) { return Math.round(v * 100) + '%'; }
const OPTS = [
  { grp: 'Gravity and surfaces' },
  { k: 'gravity', label: 'Gravity', min: 5, max: 60, step: 1, def: 25, fmt: v => v.toFixed(0), help: 'How hard things fall toward the real floor.' },
  { k: 'slide', label: 'Slide', min: 0, max: 1, step: 0.01, def: 0.5, fmt: pct, help: 'How easily the figure slides on the wood.' },
  { k: 'grip', label: 'Foot grip', min: 0, max: 2, step: 0.01, def: 0.75, fmt: v => v.toFixed(2), help: 'How well its feet hold the floor.' },
  { k: 'bounce', label: 'Bounce', min: 0, max: 0.8, step: 0.01, def: 0.15, fmt: v => v.toFixed(2), help: 'How much things bounce off the walls.' },
  { grp: 'The figure' },
  { k: 'muscle', label: 'Muscle strength', min: 0, max: 2, step: 0.01, def: 1, fmt: pct, help: 'How firmly the joints hold their pose. 0 is a limp ragdoll.' },
  { k: 'balance', label: 'Balance', min: 0, max: 2, step: 0.01, def: 1, fmt: pct, help: 'How hard it fights to stay upright over its feet.' },
  { k: 'getUp', label: 'Gets back up', tog: true, def: true, help: 'After a fall it picks itself up.' },
  { k: 'getUpDelay', label: 'Get-up delay', min: 0, max: 6, step: 0.1, def: 1.5, fmt: v => v.toFixed(1) + ' s', help: 'How long it lies there before getting up.' },
  { k: 'push', label: 'Finger push', min: 0, max: 2, step: 0.05, def: 1, fmt: pct, help: 'How hard your finger pushes him when you touch him.' },
  { k: 'knock', label: 'Knock-out hit', min: 2, max: 20, step: 0.5, def: 7, fmt: v => v.toFixed(1), help: 'How hard a hit must be to knock it limp.' },
  { grp: 'Moving the phone' },
  { k: 'shake', label: 'Shake strength', min: 0, max: 4, step: 0.05, def: 1.5, fmt: v => v.toFixed(2) + 'x', help: 'How much shaking the phone throws things about.' },
  { k: 'smooth', label: 'Sensor smoothing', min: 0, max: 0.95, step: 0.01, def: 0.5, fmt: pct, help: 'Higher is calmer, lower reacts faster.' },
  { k: 'view', label: 'View depth', min: 0, max: 1.5, step: 0.01, def: 0.3, fmt: pct, help: 'How much the view shifts as you turn the phone.' },
  { k: 'viewReturn', label: 'View re-centre', min: 0.5, max: 12, step: 0.1, def: 3, fmt: v => v.toFixed(1) + ' s', help: 'How fast the view settles back after you turn.' },
  { grp: 'Look and sound' },
  { k: 'hiQ', label: 'High detail', tog: true, def: false, help: 'Sharper picture and shadows. Slower on phones.' },
  { k: 'sound', label: 'Sound', tog: true, def: true, help: 'Footsteps, scuffs, hands on the wood, bumps and slides.' },
];
const SET = {};
const STORE = 'thebox.settings.v3';
function loadSettings() {
  for (const o of OPTS) if (o.k) SET[o.k] = o.def;
  try { Object.assign(SET, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (_) {}
}
function saveSettings() { try { localStorage.setItem(STORE, JSON.stringify(SET)); } catch (_) {} }
loadSettings();

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const DARK = new THREE.Color(0x1a120b), ROOM = new THREE.Color(0x7d7368);
scene.background = DARK;
const camera = new THREE.PerspectiveCamera();
scene.add(camera);

// ================= dimensions (world units; the screen's short side = 2) =================
const D = 2.34;      // box depth: room to turn round and get up
const LIP = 0.07;    // wall thickness at the rim
const EYE = 5.2;     // viewing distance
let hw, hh, ix, iy;

// ================= procedural wood =================
const PX = 256;
const rnd = (a, b) => a + Math.random() * (b - a);
function drawGrain(g, w, h, opt) {
  g.fillStyle = opt.base; g.fillRect(0, 0, w, h);
  const bands = opt.planks || 1, bh = h / bands;
  for (let p = 0; p < bands; p++) {
    const y0 = p * bh;
    g.save(); g.beginPath(); g.rect(0, y0, w, bh); g.clip();
    g.fillStyle = `rgba(${opt.tint},${rnd(0, opt.tintVar)})`; g.fillRect(0, y0, w, bh);
    if (Math.random() < 0.5) { g.fillStyle = `rgba(255,235,200,${rnd(0, 0.08)})`; g.fillRect(0, y0, w, bh); }
    const lines = Math.round(bh * w / 900);
    for (let i = 0; i < lines; i++) {
      const yy = y0 + Math.random() * bh, amp = rnd(1, 5), f = rnd(0.004, 0.012), ph = rnd(0, 6.28), f2 = rnd(0.02, 0.05);
      g.strokeStyle = `rgba(${opt.dark},${rnd(0.05, 0.28)})`; g.lineWidth = rnd(0.4, 2.4);
      g.beginPath();
      for (let x = -10; x <= w + 10; x += 6) {
        const y = yy + Math.sin(x * f + ph) * amp + Math.sin(x * f2 + ph * 1.7) * amp * 0.25;
        x < 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.stroke();
    }
    if (Math.random() < 0.55) {
      const kx = rnd(0.1, 0.9) * w, ky = y0 + rnd(0.3, 0.7) * bh, kr = rnd(6, 14);
      for (let k = 6; k >= 1; k--) {
        g.strokeStyle = `rgba(${opt.dark},${0.12 + 0.05 * (6 - k)})`; g.lineWidth = 1.4;
        g.beginPath(); g.ellipse(kx, ky, kr * k * 1.32, kr * k * 0.55, 0, 0, Math.PI * 2); g.stroke();
      }
      g.fillStyle = `rgba(${opt.dark},.55)`; g.beginPath(); g.ellipse(kx, ky, kr * 1.1, kr * 0.5, 0, 0, Math.PI * 2); g.fill();
    }
    g.restore();
    if (bands > 1 && p > 0) {
      g.fillStyle = 'rgba(40,22,8,.55)'; g.fillRect(0, y0 - 1.2, w, 2.4);
      g.fillStyle = 'rgba(255,230,190,.12)'; g.fillRect(0, y0 + 1.2, w, 1.2);
    }
  }
  const img = g.getImageData(0, 0, w, h), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
}
function cloneCanvas(src) { const c = document.createElement('canvas'); c.width = src.width; c.height = src.height; c.getContext('2d').drawImage(src, 0, 0); return c; }
// ao: corner darkening per edge, canvas orientation (top = the plane's +y)
function woodTexture(worldW, worldH, alongX, opt, ao) {
  const w = Math.max(64, Math.round(worldW * PX)), h = Math.max(64, Math.round(worldH * PX));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (alongX) drawGrain(g, w, h, opt);
  else {
    const t = document.createElement('canvas'); t.width = h; t.height = w;
    drawGrain(t.getContext('2d'), h, w, opt);
    g.save(); g.translate(w, 0); g.rotate(Math.PI / 2); g.drawImage(t, 0, 0); g.restore();
  }
  const bump = new THREE.CanvasTexture(cloneCanvas(c));   // the grain, before the corner shading
  const aoW = 0.28 * PX;
  const edge = (x0, y0, x1, y1, s, rx, ry, rw, rh) => {
    if (!s) return;
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, `rgba(20,10,3,${s})`); gr.addColorStop(1, 'rgba(20,10,3,0)');
    g.fillStyle = gr; g.fillRect(rx, ry, rw, rh);
  };
  edge(0, 0, 0, aoW, ao.top, 0, 0, w, aoW);
  edge(0, h, 0, h - aoW, ao.bottom, 0, h - aoW, w, aoW);
  edge(0, 0, aoW, 0, ao.left, 0, 0, aoW, h);
  edge(w, 0, w - aoW, 0, ao.right, w - aoW, 0, aoW, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = bump.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return { map: tex, bump };
}

const WALL = { base: '#c99a62', tint: '120,70,25', tintVar: 0.12, dark: '92,52,18', planks: 1 };
const FLOOR = { base: '#ad7642', tint: '90,45,12', tintVar: 0.22, dark: '70,36,10', planks: 4 };
const RIM = { base: '#ddb57f', tint: '150,95,40', tintVar: 0.1, dark: '120,75,30', planks: 1 };
function woodMat(t) {
  const m = new THREE.MeshStandardMaterial({ map: t.map, bumpMap: t.bump, bumpScale: 1.2, roughness: 0.74, metalness: 0 });
  m.envMapIntensity = 0.55;   // light bounced between the walls
  return m;
}

// ================= the box =================
let boxGroup = null;
function buildBox() {
  const s = Math.min(innerWidth, innerHeight);
  hw = innerWidth / s; hh = innerHeight / s;
  ix = hw - LIP; iy = hh - LIP;
  if (boxGroup) {
    boxGroup.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.map?.dispose(); o.material.bumpMap?.dispose(); o.material.dispose(); } });
    scene.remove(boxGroup);
  }
  boxGroup = new THREE.Group(); scene.add(boxGroup);
  const longY = iy >= ix;
  const back = new THREE.Mesh(new THREE.PlaneGeometry(2 * ix, 2 * iy),
    woodMat(woodTexture(2 * ix, 2 * iy, !longY, WALL, { top: .45, bottom: .45, left: .45, right: .45 })));
  back.position.z = -D; back.receiveShadow = true; boxGroup.add(back);
  const deep = .5, side = .34;
  const left = new THREE.Mesh(new THREE.PlaneGeometry(D, 2 * iy), woodMat(woodTexture(D, 2 * iy, false, WALL, { right: deep, top: side, bottom: side })));
  left.rotation.y = Math.PI / 2; left.position.set(-ix, 0, -D / 2);
  const right = new THREE.Mesh(new THREE.PlaneGeometry(D, 2 * iy), woodMat(woodTexture(D, 2 * iy, false, WALL, { left: deep, top: side, bottom: side })));
  right.rotation.y = -Math.PI / 2; right.position.set(ix, 0, -D / 2);
  const bottom = new THREE.Mesh(new THREE.PlaneGeometry(2 * ix, D), woodMat(woodTexture(2 * ix, D, true, FLOOR, { top: deep, left: side, right: side })));
  bottom.rotation.x = -Math.PI / 2; bottom.position.set(0, -iy, -D / 2);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(2 * ix, D), woodMat(woodTexture(2 * ix, D, true, WALL, { bottom: deep, left: side, right: side })));
  top.rotation.x = Math.PI / 2; top.position.set(0, iy, -D / 2);
  for (const w of [left, right, bottom, top]) { w.receiveShadow = true; boxGroup.add(w); }
  // the rim (the walls' top edge), flush with the screen
  const shape = new THREE.Shape();
  shape.moveTo(-hw - .01, -hh - .01); shape.lineTo(hw + .01, -hh - .01); shape.lineTo(hw + .01, hh + .01); shape.lineTo(-hw - .01, hh + .01); shape.closePath();
  const hole = new THREE.Path();
  hole.moveTo(-ix, -iy); hole.lineTo(-ix, iy); hole.lineTo(ix, iy); hole.lineTo(ix, -iy); hole.closePath();
  shape.holes.push(hole);
  const rimGeo = new THREE.ShapeGeometry(shape);
  const uv = rimGeo.attributes.uv, pos = rimGeo.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + hw) / (2 * hw), (pos.getY(i) + hh) / (2 * hh));
  const rt = woodTexture(2 * hw, 2 * hh, true, RIM, {});
  const rim = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({ map: rt.map, bumpMap: rt.bump, bumpScale: 1, roughness: .7, emissive: 0x2a1a0c, emissiveIntensity: .45 }));
  rim.material.envMapIntensity = .4;
  boxGroup.add(rim);
  physWalls();
  envDirty = 0;
}

// ================= lights =================
// one soft key light from the room, always from real "up" and in front of the glass
const spot = new THREE.SpotLight(0xfff0dc, 70, 0, 0.6, 0.65, 2);
spot.castShadow = true;
spot.shadow.bias = -0.0004;
spot.shadow.normalBias = 0.02;
scene.add(spot, spot.target);
scene.add(new THREE.HemisphereLight(0xfff2e0, 0x3a2410, 0.12));
const lightUp = new THREE.Vector3(0, 1, 0);
function placeLight() {
  const dir = new THREE.Vector3(lightUp.x * 0.75, lightUp.y * 0.75, 0.85);
  if (dir.z < 0.55) dir.z = 0.55;
  dir.normalize();
  const dist = 4.6;
  spot.position.set(dir.x * dist, dir.y * dist, -D / 2 + dir.z * dist);
  spot.target.position.set(0, 0, -D * 0.7);
  spot.angle = Math.atan((Math.max(hw, hh) + 0.4) / dist) + 0.12;
}

// bounce light: the inside of the box seen from its middle lights the figure and the walls
const cubeRT = new THREE.WebGLCubeRenderTarget(48, { type: THREE.HalfFloatType });
const envUp = new THREE.Vector3(); let envFrame = 0;
const cubeCam = new THREE.CubeCamera(0.02, 30, cubeRT);
scene.add(cubeCam);
scene.environment = cubeRT.texture;
let envDirty = 0;
const movers = [];   // hidden while the box looks at itself
function updateEnv() {
  cubeCam.position.set(0, 0, -D / 2);
  for (const m of movers) m.visible = false;
  scene.background = ROOM;   // what comes in through the glass: the room
  cubeCam.update(renderer, scene);
  scene.background = DARK;
  for (const m of movers) m.visible = true;
  cubeRT.texture.needsPMREMUpdate = true;
}

// ================= physics: Jolt =================
// cannon-es is kept only for its small vector and rotation maths
const Jolt = await initJolt();
const LAYER_STILL = 0, LAYER_MOVING = 1;
const jolt = (() => {
  const st = new Jolt.JoltSettings();
  const ol = new Jolt.ObjectLayerPairFilterTable(2);
  ol.EnableCollision(LAYER_STILL, LAYER_MOVING);
  ol.EnableCollision(LAYER_MOVING, LAYER_MOVING);
  const bp = new Jolt.BroadPhaseLayerInterfaceTable(2, 2);
  bp.MapObjectToBroadPhaseLayer(LAYER_STILL, new Jolt.BroadPhaseLayer(0));
  bp.MapObjectToBroadPhaseLayer(LAYER_MOVING, new Jolt.BroadPhaseLayer(1));
  st.mObjectLayerPairFilter = ol;
  st.mBroadPhaseLayerInterface = bp;
  st.mObjectVsBroadPhaseLayerFilter = new Jolt.ObjectVsBroadPhaseLayerFilterTable(st.mBroadPhaseLayerInterface, 2, st.mObjectLayerPairFilter, 2);
  const j = new Jolt.JoltInterface(st);
  Jolt.destroy(st);
  return j;
})();
const physics = jolt.GetPhysicsSystem();
// A body standing on its own muscles is a long chain (floor - foot - shin - thigh - pelvis ...) of very different masses;
// the solver needs more passes than the default to carry the muscles' pushes through it to the floor.
function solverPasses(v, p) { const ps = physics.GetPhysicsSettings(); ps.mNumVelocitySteps = v; ps.mNumPositionSteps = p; physics.SetPhysicsSettings(ps); }
solverPasses(40, 4);
const bodies = physics.GetBodyInterface();
const lockNo = physics.GetBodyLockInterfaceNoLock();
const gravity = new CANNON.Vec3(0, -SET.gravity, 0);
const jv = new Jolt.Vec3(0, 0, 0), jv2 = new Jolt.Vec3(0, 0, 0), jr = new Jolt.RVec3(0, 0, 0), jq = new Jolt.Quat(0, 0, 0, 1);
function setGravity() { jv.Set(gravity.x, gravity.y, gravity.z); physics.SetGravity(jv); }
setGravity();

// the box: back, four walls and the glass, as thick slabs
let wallIds = [];

function slab(hx, hy, hz, x, y, z) {
  const bcs = new Jolt.BodyCreationSettings(new Jolt.BoxShape(new Jolt.Vec3(hx, hy, hz), 0.02), new Jolt.RVec3(x, y, z), new Jolt.Quat(0, 0, 0, 1), Jolt.EMotionType_Static, LAYER_STILL);

  const b = bodies.CreateBody(bcs); Jolt.destroy(bcs);
  bodies.AddBody(b.GetID(), Jolt.EActivation_DontActivate);

}
function physWalls() {
  for (const id of wallIds) { bodies.RemoveBody(id); bodies.DestroyBody(id); }
  const T = 0.5;
  wallIds = [
    slab(ix + T, iy + T, T / 2, 0, 0, -D - T / 2),        // back
    slab(ix + T, iy + T, T / 2, 0, 0, T / 2),             // glass
    slab(T / 2, iy + T, D / 2 + T, -ix - T / 2, 0, -D / 2),

// one moving part: its state read from Jolt each step, in the maths the controller uses, and the pushes it asks for
class Part {
  constructor(name, P, body) {
    this.name = name; this.P = P; this.body = body; this.id = body.GetID();
    this.mass = P.mass; this.isCore = !!P.core;
    this.position = new CANNON.Vec3(); this.quaternion = new CANNON.Quaternion();
    this.velocity = new CANNON.Vec3(); this.angularVelocity = new CANNON.Vec3();
    this.force = new CANNON.Vec3(); this.torque = new CANNON.Vec3();
    this.prevV = new CANNON.Vec3();
    const ii = body.GetMotionProperties().GetInverseInertiaDiagonal();
    this.inertia = new CANNON.Vec3(1 / ii.GetX(), 1 / ii.GetY(), 1 / ii.GetZ());
    this.mass = 1 / body.GetMotionProperties().GetInverseMass();
  }
  pull() {
    const b = this.body, p = b.GetPosition(), q = b.GetRotation(), v = b.GetLinearVelocity(), w = b.GetAngularVelocity();
    this.prevV.copy(this.velocity);
    this.position.set(p.GetX(), p.GetY(), p.GetZ());
    this.quaternion.set(q.GetX(), q.GetY(), q.GetZ(), q.GetW());
    this.velocity.set(v.GetX(), v.GetY(), v.GetZ());
    this.angularVelocity.set(w.GetX(), w.GetY(), w.GetZ());
  }
  push() {
    const f = this.force, t = this.torque;
    EXT.f.vadd(f, EXT.f); EXT.t.vadd(t, EXT.t); EXT.t.vadd(this.position.cross(f), EXT.t);
    if (f.x || f.y || f.z) { jv.Set(f.x, f.y, f.z); this.body.AddForce(jv); f.set(0, 0, 0); }
    if (t.x || t.y || t.z) { jv.Set(t.x, t.y, t.z); this.body.AddTorque(jv); t.set(0, 0, 0); }
  }
  place(p, q) {
    jr.Set(p.x, p.y, p.z);
    const qq = new Jolt.Quat(q.x, q.y, q.z, q.w);
    bodies.SetPositionAndRotation(this.id, jr, qq, Jolt.EActivation_Activate);
    Jolt.destroy(qq);
    jv.Set(0, 0, 0); jv2.Set(0, 0, 0);
    bodies.SetLinearAndAngularVelocity(this.id, jv, jv2);
  }
}

// hits hard enough to knock it out: a sudden stop near a wall (the sounds are in the sound section)
function hitCheck(part) {
  const dv = part.velocity.vsub(part.prevV).length();
  if (dv < 1.2 || !part.isCore || dv <= SET.knock) return;
  const p = part.position, r = 0.12 * S;
  const nearWall = ix - Math.abs(p.x) < r || iy - Math.abs(p.y) < r || p.z + D < r || -p.z < r;
  if (nearWall) stun = 0.7;
}

function applySurfaces() {
  const b = SET.bounce;
  for (const nm in B) {
    const part = B[nm];
    part.body.SetFriction(part.P.foot ? SET.grip * 0.9 : 0.12 + (1 - SET.slide) * 0.8);
    part.body.SetRestitution(part.P.foot ? 0 : b);   // feet don't bounce (a bouncing foot chatters under the body's weight)
  }
}

// A smooth body made of stacked superellipse rings [y, half width, half depth, z shift, x shift], domed at the ends.
// bump(angle, y) pushes the surface out (angle 0 = toward the glass, +PI/2 = +x).
function loft(secs, o = {}) {
  const e = 2 / (o.n || 2), seg = o.seg || 36, sub = o.sub || 4;
  const sec = secs.map(s => [s[0], s[1], s[2], s[3] || 0, s[4] || 0]);
  const L = sec.length, at = i => sec[Math.max(0, Math.min(L - 1, i))];
  const cr = (a, b, c, d, t) => 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (3 * b - a - 3 * c + d) * t * t * t);
  let rings = [];
  for (let i = 0; i < L - 1; i++) for (let k = 0; k < sub; k++) {
    const r = []; for (let c = 0; c < 5; c++) r.push(cr(at(i - 1)[c], at(i)[c], at(i + 1)[c], at(i + 2)[c], k / sub)); rings.push(r);
  }
  rings.push(sec[L - 1]);
  const cap = (r, h, sg) => { const out = []; for (let k = 1; k <= 5; k++) { const a = k / 6 * PI / 2, c = Math.cos(a); out.push([r[0] + sg * h * Math.sin(a), r[1] * c, r[2] * c, r[3], r[4]]); } return out; };
  const cb = o.capB || 0, ct = o.capT || 0;
  const r0 = rings[0], r1 = rings[rings.length - 1];
  if (cb) rings = cap(r0, cb, -1).reverse().concat(rings);
  if (ct) rings = rings.concat(cap(r1, ct, 1));
  const pos = [r0[4], r0[0] - cb, r0[3]];
  for (const [y, w, d, oz, ox] of rings) for (let j = 0; j < seg; j++) {
    let th = j / seg * 2 * PI; const s = Math.sin(th), c = Math.cos(th); if (th > PI) th -= 2 * PI;
    const b = o.bump ? o.bump(th, y) : 0;
    pos.push(ox + w * Math.sign(s) * Math.pow(Math.abs(s), e) + b * s, y, oz + d * Math.sign(c) * Math.pow(Math.abs(c), e) + b * c);
  }
  pos.push(r1[4], r1[0] + ct, r1[3]);

  for (let j = 0; j < seg; j++) {
    idx.push(v(0, j), 0, v(0, j + 1));

    idx.push(v(R - 1, j), v(R - 1, j + 1), top);

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();

  // into the box: builds up over a moment, like a finger pressing; plus the way the finger has moved on the glass
  const press = W * 0.4 * Math.min(1, poke.t / 0.15) * SET.push;
  const k = 2 * Math.min(innerWidth, innerHeight);   // pixels -> box units
  const dx = (poke.x - poke.x0) / k * 2 * hw, dy = -(poke.y - poke.y0) / k * 2 * hw;
  const F = new CANNON.Vec3(dx, dy, 0).scale(W * 2.2 * SET.push).vadd(new CANNON.Vec3(0, 0, -press));
  const lim = W * 1.2; if (vlen(F) > lim) F.scale(lim / vlen(F), F);
  jvF.Set(F.x, F.y, F.z); jrP.Set(at.x, at.y, at.z);
  bodies.AddForce(b.id, jvF, jrP, Jolt.EActivation_Activate);
  poke.where = at;
}

// finger / mouse: drag to turn the box (back upright when let go)
let drag = null;
const dragRot = { roll: 0, pitch: 0 }, dragS = { roll: 0, pitch: 0 };
const el = renderer.domElement;
el.addEventListener('pointerdown', e => {
  if (look.on) return;
  const hit = figureAt(e.clientX, e.clientY);
  if (hit && SET.push > 0) {
    Object.assign(poke, { on: true, part: hit.part, local: hit.local, t: 0, x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, id: e.pointerId });
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  if (mode === 'sensor') return;
  drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; try { el.setPointerCapture(e.pointerId); } catch (_) {}
});
el.addEventListener('pointermove', e => { if (poke.on && e.pointerId === poke.id) { poke.x = e.clientX; poke.y = e.clientY; } });
const endPoke = e => { if (poke.on && e.pointerId === poke.id) { poke.on = false; poke.lastAt = performance.now(); } };
el.addEventListener('pointerup', endPoke); el.addEventListener('pointercancel', endPoke);
el.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const k = Math.min(innerWidth, innerHeight) * 0.45;
  dragRot.roll = clamp((e.clientX - drag.x) / k, -1.6, 1.6) * 75 * DEG;
  dragRot.pitch = clamp((e.clientY - drag.y) / k, -1.6, 1.6) * 75 * DEG;
});
const endDrag = e => { if (drag && e.pointerId === drag.id) { drag = null; dragRot.roll = 0; dragRot.pitch = 0; } };
el.addEventListener('pointerup', endDrag);
// a double tap stands it up again
let lastTap = 0, tapAt = null;
el.addEventListener('pointerdown', e => { tapAt = figureAt(e.clientX, e.clientY) ? null : { x: e.clientX, y: e.clientY, t: performance.now() }; });
el.addEventListener('pointerup', e => {
  if (!tapAt || performance.now() - tapAt.t > 300 || Math.hypot(e.clientX - tapAt.x, e.clientY - tapAt.y) > 24) return;
  const now = performance.now();
  if (look.on) return;
  if (now - lastTap < 350) { standUp(); lastTap = 0; note('Reset', 900); } else lastTap = now;
});
el.addEventListener('pointercancel', endDrag);

function note(text, ms) {
  const n = $('note'); n.textContent = text; n.classList.add('show');
  clearTimeout(note.t); if (ms) note.t = setTimeout(() => n.classList.remove('show'), ms);
}

// ================= sound =================
let actx = null;
// The figure's sounds: only when a part meets the wood, soft and muffled, like a person in a wooden box. A foot landing
// is a soft heel-then-sole step; a hand is a light pat; knees, elbows, head and body land with a dull thump (the
// heavier and faster, the lower and louder); a foot dragging fast gives a quiet scuff. Nothing sounds while parts move
// in the air or rest on the wood. Made from filtered noise (no recordings to load).
const SFX = { out: null, noise: null, st: {}, last: {}, recent: [] };
function sfxInit() {
  if (!actx || SFX.out) return;
  // everything through a gentle low-pass and a soft limiter: no harsh highs, no ringing
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 0.5;
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 4; comp.attack.value = 0.002; comp.release.value = 0.12;
  SFX.out = actx.createGain(); SFX.out.gain.value = 0.8;
  SFX.out.connect(lp).connect(comp).connect(actx.destination);
  const len = actx.sampleRate, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  let br = 0; for (let i = 0; i < len; i++) { br = 0.9 * br + 0.1 * (Math.random() * 2 - 1); d[i] = br * 2.5; }   // soft, dark noise
  SFX.noise = buf;
}
function soft(t, dur, cut, gain) {   // a short, muffled noise touch
  const src = actx.createBufferSource(); src.buffer = SFX.noise;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; f.Q.value = 0.4;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(SFX.out); src.start(t, Math.random() * 0.8); src.stop(t + dur + 0.03);
}
function weight(t, f0, dur, gain) {   // the low body of a landing (felt more than heard)
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.7, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(SFX.out); o.start(t); o.stop(t + dur + 0.03);
}
// the wall-ward reach of a part's shape from its centre, along a wall's normal
function reachAlong(b, nrm) {
  const P = b.P, q = b.quaternion;
  if (P.box) { let r = 0; const h = P.box.map(v => v * S / 2); const ax = [new CANNON.Vec3(1, 0, 0), new CANNON.Vec3(0, 1, 0), new CANNON.Vec3(0, 0, 1)]; for (let i = 0; i < 3; i++) r += Math.abs(q.vmult(ax[i]).dot(nrm)) * h[i]; return r; }
  if (P.limb) return P.limb[0] * S + Math.max(0, P.limb[1] * S - P.limb[0] * S) * Math.abs(q.vmult(new CANNON.Vec3(0, 1, 0)).dot(nrm));
  return P.head * S * 1.06;
}
const WALLS = () => [[new CANNON.Vec3(-1, 0, 0), ix], [new CANNON.Vec3(1, 0, 0), ix], [new CANNON.Vec3(0, -1, 0), iy], [new CANNON.Vec3(0, 1, 0), iy], [new CANNON.Vec3(0, 0, -1), 0], [new CANNON.Vec3(0, 0, 1), D]];
function sfxUpdate(dt) {
  if (!actx || !SET.sound) return;
  sfxInit();
  const now = performance.now(), t = actx.currentTime + 0.01;
  SFX.recent = SFX.recent.filter(x => now - x < 120);
  for (const nm in B) {
    if (nm.startsWith('toe')) continue;            // the foot speaks for the toes
    const b = B[nm];
    let best = null, gap = 9;
    for (const [nw, off] of WALLS()) { const g_ = off - b.position.dot(nw) - reachAlong(b, nw); if (g_ < gap) { gap = g_; best = nw; } }
    // touching with a little hysteresis, so resting parts that jiggle stay silent
    const st = SFX.st[nm] || (SFX.st[nm] = { on: true, away: 0 });
    if (st.on) { if (gap > 0.035 * S) { st.on = false; st.away = 0; } continue; }
    st.away += dt;
    if (gap > 0.012 * S) continue;
    st.on = true;
    const vIn = b.velocity.dot(best);
    if (vIn < 0.35 * S || st.away < 0.06 || SFX.recent.length > 4 || now - (SFX.last[nm] || 0) < 120) continue;
    SFX.last[nm] = now; SFX.recent.push(now);
    const v = clamp(vIn / (2.5 * S), 0, 1), v2 = Math.sqrt(v);
    if (nm.startsWith('foot')) {                     // a step on wood: heel, then the sole
      weight(t, 70, 0.08, 0.10 * v2); soft(t, 0.07, 420 + 300 * v, 0.22 * v2);
      soft(t + 0.045 + 0.03 * (1 - v), 0.06, 650, 0.10 * v2);
    } else if (nm.startsWith('hand')) soft(t, 0.05, 900 + 500 * v, 0.16 * v2);        // a palm on the wood
    else if (/^(fArm|uArm|shin|thigh|clav|neck)/.test(nm)) { weight(t, 90, 0.08, 0.08 * v2); soft(t, 0.07, 500, 0.15 * v2); }
    else { weight(t, 58, 0.16, 0.22 * v2); soft(t, 0.12, 320 + 200 * v, 0.28 * v2); }   // body or head: a dull thump
  }
  // a foot dragging fast along the floor: a quiet scuff now and then
  for (const sd of ['L', 'R']) {
    const f = B['foot' + sd], st = SFX.st['foot' + sd];
    if (!st || !st.on) continue;
    const sp = vlen(along(f.velocity, curFloor ? curFloor.nv : Y));
    if (sp > 0.6 * S && now - (SFX.last['scuff' + sd] || 0) > 160) { SFX.last['scuff' + sd] = now; soft(t, 0.1, 700, clamp((sp - 0.6 * S) / (2 * S), 0.03, 0.08)); }
  }
}

// ================= full screen =================
async function goFull() {
  const de = document.documentElement;
  try {
    if (!document.fullscreenElement && de.requestFullscreen) await de.requestFullscreen({ navigationUI: 'hide' });
    else if (!document.webkitFullscreenElement && de.webkitRequestFullscreen) de.webkitRequestFullscreen();
  } catch (_) {}
  try { await screen.orientation.lock('portrait'); } catch (_) {}
}
function fullSync() {
  const de = document.documentElement;
  const on = !!(document.fullscreenElement || document.webkitFullscreenElement) || matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  $('full').style.display = on || !(de.requestFullscreen || de.webkitRequestFullscreen) ? 'none' : '';
}
document.addEventListener('fullscreenchange', fullSync);
document.addEventListener('webkitfullscreenchange', fullSync);
$('full').onclick = goFull;

// ================= Options panel =================
function buildOptions() {
  const box = $('optRows'); box.innerHTML = '';
  for (const o of OPTS) {
    if (o.grp) { const g = document.createElement('div'); g.className = 'grp'; g.textContent = o.grp; box.appendChild(g); continue; }
    const row = document.createElement('div');
    if (o.tog) {
      row.className = 'row tog';
      row.innerHTML = `<div><div class="top"><span>${o.label}</span></div><div class="help">${o.help}</div></div><button class="sw" aria-label="${o.label}"></button>`;
      const b = row.querySelector('.sw');
      const sync = () => b.classList.toggle('on', !!SET[o.k]);
      b.onclick = () => { SET[o.k] = !SET[o.k]; sync(); changed(o.k); };
      sync();
    } else {
      row.className = 'row';
      row.innerHTML = `<div class="top"><span>${o.label}</span><span></span></div><input type="range" min="${o.min}" max="${o.max}" step="${o.step}"><div class="help">${o.help}</div>`;
      const inp = row.querySelector('input'), val = row.querySelector('.top span:last-child');
      inp.value = SET[o.k]; val.textContent = o.fmt(+SET[o.k]);
      inp.oninput = () => { SET[o.k] = +inp.value; val.textContent = o.fmt(+inp.value); changed(o.k); };
    }
    box.appendChild(row);
  }
}
function changed(k) {
  saveSettings();
  if (k === 'slide' || k === 'grip' || k === 'bounce') applySurfaces();
  if (k === 'hiQ') applyQuality();
}
$('optBtn').onclick = () => $('opts').classList.add('open');
$('optClose').onclick = () => $('opts').classList.remove('open');
$('resetFig').onclick = () => standUp();
$('resetVals').onclick = () => { for (const o of OPTS) if (o.k) SET[o.k] = o.def; saveSettings(); buildOptions(); applySurfaces(); applyQuality(); };
for (const ev of ['pointerdown', 'pointermove', 'touchmove']) $('opts').addEventListener(ev, e => e.stopPropagation(), { passive: true });

// ================= picture quality: sharpness follows the frame rate =================
let dpr = 1, dprMax = 1;
function resizeAll() { renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight); }
function applyQuality() {
  const size = SET.hiQ ? 2048 : 1024;
  if (spot.shadow.mapSize.x !== size) {
    spot.shadow.mapSize.set(size, size);
    if (spot.shadow.map) { spot.shadow.map.dispose(); spot.shadow.map = null; }
  }
  dprMax = Math.min(window.devicePixelRatio || 1, SET.hiQ ? 2 : 1.5);
  dpr = dprMax;
  resizeAll();
}
// if frames take too long, draw fewer pixels (and more again when there's room)
let ftSum = 0, ftN = 0, ftT = 0, settleT = 0;
function adaptSharpness(dt) {
  ftSum += dt; ftN++; ftT += dt; settleT += dt;
  if (ftT < 1) return;
  const avg = ftSum / ftN; ftSum = 0; ftN = 0; ftT = 0;
  if (settleT < 2) return;
  if (avg > 1 / 52 && dpr > 0.75) { dpr = Math.max(0.75, dpr - 0.25); resizeAll(); settleT = 0; }
  else if (avg < 1 / 58 && dpr < dprMax && settleT > 4) { dpr = Math.min(dprMax, dpr + 0.25); resizeAll(); settleT = 0; }
}

// ================= camera: a window into the box =================
const eyeV = new THREE.Vector3(), qInvT = new THREE.Quaternion();
function updateCamera(dt) {
  let ex = 0, ey = 0;
  if (mode === 'sensor' && haveBase) {
    // the eye stays where it was in the room; as the phone turns from its resting way, the eye moves across the glass
    qBase.slerp(qDev, 1 - Math.exp(-dt / SET.viewReturn));
    eyeV.set(0, 0, 1).applyQuaternion(qBase).applyQuaternion(qInvT.copy(qDev).invert());
    toScreen(eyeV.x, eyeV.y, 0, eyeV);
    ex = eyeV.x; ey = eyeV.y;
  } else if (mode !== 'sensor') {
    ex = -Math.sin(dragS.roll) * 0.6; ey = Math.sin(dragS.pitch) * 0.9;
  }
  const lim = 1.4, gain = EYE * SET.view;
  ex = lim * Math.tanh(gain * ex / lim); ey = lim * Math.tanh(gain * ey / lim);
  const ez = EYE;
  camera.position.set(ex, ey, ez);
  camera.quaternion.identity();
  camera.updateMatrixWorld();
  const n = 0.05, f = 40, k = n / ez;
  camera.projectionMatrix.makePerspective((-hw - ex) * k, (hw - ex) * k, (hh - ey) * k, (-hh - ey) * k, n, f);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}

// ================= look mode: physics stops, he holds his pose, a finger turns the view around him =================
const look = { on: false, yaw: 0, pitch: 0.12, dist: 0, tgt: new THREE.Vector3(), drag: null };
$('look').onclick = e => {
  e.stopPropagation();
  look.on = !look.on; $('look').classList.toggle('on', look.on);
  if (look.on) {
    const p = B.pelvis.position, h = B.head.position;
    look.tgt.set(p.x + (h.x - p.x) * 0.25, p.y + (h.y - p.y) * 0.25, p.z + (h.z - p.z) * 0.25);
    look.yaw = 0; look.pitch = 0.1; look.dist = 1.75 * S * 1.75;
    poke.on = false; drag = null;
    note('Paused. Slide to look around him; tap the circle to carry on.', 2600);
  } else { acc = 0; last = performance.now(); }
  if (boxGroup) boxGroup.visible = !look.on;
};
for (const ev of ['pointerdown', 'pointerup']) $('look').addEventListener(ev, e => e.stopPropagation());
el.addEventListener('pointerdown', e => { if (look.on) look.drag = { x: e.clientX, y: e.clientY, yaw: look.yaw, pitch: look.pitch, id: e.pointerId }; }, true);
el.addEventListener('pointermove', e => {
  if (!look.on || !look.drag || e.pointerId !== look.drag.id) return;
  const k = Math.PI / Math.min(innerWidth, innerHeight);
  look.yaw = look.drag.yaw - (e.clientX - look.drag.x) * k * 1.2;
  look.pitch = clamp(look.drag.pitch + (e.clientY - look.drag.y) * k, -1.2, 1.35);
}, true);
el.addEventListener('pointerup', e => { if (look.on) look.drag = null; }, true);
function lookCamera() {
  const c = Math.cos(look.pitch);
  camera.position.set(look.tgt.x + look.dist * c * Math.sin(look.yaw), look.tgt.y + look.dist * Math.sin(look.pitch), look.tgt.z + look.dist * c * Math.cos(look.yaw));
  camera.up.set(0, 1, 0); camera.lookAt(look.tgt); camera.updateMatrixWorld();
  const n = 0.05, top = n * Math.tan(25 * DEG), right = top * hw / hh;   // a 50-degree view
  camera.projectionMatrix.makePerspective(-right, right, top, -top, n, 40);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}

// ================= the loop =================
const STEP = 1 / 60;
let acc = 0, last = performance.now(), frameN = 0;
const lu = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  // which way is down?
  let gx, gy, gz;
  if (mode === 'sensor') {
    gS.lerp(gRaw, 1 - Math.pow(SET.smooth, dt * 60));
    gx = gS.x; gy = gS.y; gz = gS.z;
  } else {
    const a = Math.min(1, dt * 10);
    dragS.roll += (dragRot.roll - dragS.roll) * a; dragS.pitch += (dragRot.pitch - dragS.pitch) * a;
    gx = Math.sin(dragS.roll) * Math.cos(dragS.pitch);
    gy = -Math.cos(dragS.roll) * Math.cos(dragS.pitch);
    gz = -Math.sin(dragS.pitch);
  }
  gravity.set(gx * SET.gravity, gy * SET.gravity, gz * SET.gravity);
  setGravity();
  // the room's light stays up
  const gl = Math.hypot(gx, gy, gz) || 1;
  lu.set(-gx / gl, -gy / gl, -gz / gl);
  lightUp.lerp(lu, Math.min(1, dt * 4)).normalize();
  placeLight();

  acc += look.on ? 0 : dt;
  let n = 0;
  while (acc >= STEP && n < 2) {
    for (const nm in B) B[nm].pull();
    control(STEP);
    for (const nm in B) B[nm].push();
    EXT.check();
    fingerPush(STEP);
    jolt.Step(STEP, 1);
    acc -= STEP; n++;
  }
  if (n === 2) acc = 0;
  for (const nm in B) { B[nm].pull(); hitCheck(B[nm]); }
  sfxUpdate(dt);
  for (const [b, m] of syncs) { m.position.copy(b.position); m.quaternion.copy(b.quaternion); }

  if (look.on) lookCamera(); else updateCamera(dt);
  // bounce light: redrawn only when the light has moved
  frameN++;
  if (envDirty < 2 || (lightUp.angleTo(envUp) > 4 * DEG && frameN - envFrame > 12)) { updateEnv(); envDirty++; envUp.copy(lightUp); envFrame = frameN; }
  renderer.render(scene, camera);
  adaptSharpness(dt);
  requestAnimationFrame(frame);
}

// ================= start =================
$('go').disabled = false; $('go').textContent = 'Start';
$('go').onclick = async () => {
  goFull();
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); await actx.resume(); } catch (_) { actx = null; }
  for (const Ev of [window.DeviceOrientationEvent, window.DeviceMotionEvent]) {
    try { if (Ev && typeof Ev.requestPermission === 'function') await Ev.requestPermission(); } catch (_) {}
  }
  window.addEventListener('deviceorientation', onOrientation);
  window.addEventListener('devicemotion', onMotion);
  $('start').classList.add('hide');
  $('hud').classList.add('show');
  fullSync();
  setTimeout(() => { if (mode !== 'sensor') { mode = 'touch'; note('No motion sensors here, so drag to turn the box.', 4500); } }, 1300);
};

addEventListener('resize', () => { resizeAll(); buildBox(); buildFigure(); });
buildOptions();
buildBox();
buildFigure();
applyQuality();
requestAnimationFrame(frame);
</script>
</body>
