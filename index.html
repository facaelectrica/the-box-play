<script>
// ================= loading screen + early downloads (v15.21) =================
// Every big file starts downloading here, all at once, the moment the page arrives (before v15.21 each waited for the
// one before it: ~20 MB one after another), and the start screen shows each with its percentage. The module script
// further down picks them up with BOXLOAD.take(url): the same URL gets the same download, anything not started here
// is fetched then. take() forgets the file, so no second copy stays in memory.
window.BOXLOAD = (() => {
  const MB = 1048576, rows = new Map(), started = new Map();
  const list = document.getElementById('loadRows'), pctEl = document.getElementById('loadPct');
  const bar = document.querySelector('#loadBar i');
  let shown = 0, finished = false, queued = false;
  function row(label) {
    let r = rows.get(label);
    if (!r) {
      r = { label, got: 0, total: 0, left: 0, state: 'wait', el: document.createElement('div') };
      r.el.className = 'lr'; r.el.innerHTML = '<span></span><span></span>'; r.el.firstChild.textContent = label;
      list.appendChild(r.el); rows.set(label, r);
    }
    return r;
  }
  const mb = v => (v / MB).toFixed(1);
  function paint() {
    queued = false;
    let got = 0, total = 0;
    for (const r of rows.values()) {
      got += Math.min(r.got, r.total || r.got); total += Math.max(r.total, r.got);
      let t;
      if (r.state === 'load') t = r.total ? mb(r.got) + ' / ' + mb(r.total) + ' MB  ' + Math.min(99, Math.floor(100 * r.got / r.total)) + '%' : (r.got ? mb(r.got) + ' MB' : '…');
      else t = { wait: 'waiting', got: '100%', start: 'starting…', build: 'building…', ready: '✓', fail: 'didn’t load' }[r.state];
      r.el.lastChild.textContent = t; r.el.className = 'lr ' + r.state;
    }
    // the total only moves forward (a file's real size can arrive after its estimate)
    const p = finished ? 100 : Math.min(99, total ? 100 * got / total : 0);
    shown = Math.max(shown, p);
    pctEl.textContent = Math.floor(shown) + '%'; bar.style.width = shown + '%';
  }
  function repaint() { if (!queued) { queued = true; requestAnimationFrame(paint); } }
  // fetch with progress; `hint` = expected size in bytes (needed where the server compresses: the reader counts
  // unpacked bytes)
  async function download(url, label, hint = 0) {
    const r = row(label);
    r.left++; if (r.state === 'wait' || r.state === 'got') r.state = 'load';
    let total = hint, got = 0;
    r.total += hint; repaint();
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(url + ': HTTP ' + res.status);
      const len = +res.headers.get('content-length') || 0;
      if (!hint && len && !res.headers.get('content-encoding')) { r.total += len; total = len; }
      let out;
      if (res.body && res.body.getReader) {
        const reader = res.body.getReader(), parts = [];
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          parts.push(value); got += value.length; r.got += value.length; repaint();
        }
        out = new Uint8Array(got); let o = 0;
        for (const p of parts) { out.set(p, o); o += p.length; }
      } else { out = new Uint8Array(await res.arrayBuffer()); got = out.length; r.got += got; }
      r.total += got - total;   // the real size
      if (--r.left === 0 && r.state === 'load') r.state = 'got';
      repaint();
      return out.buffer;
    } catch (e) {
      r.left--; r.state = 'fail'; repaint();
      throw e;
    }
  }
  function start(url, label, hint) {
    const p = download(url, label, hint); p.catch(() => {});
    started.set(url, p); return p;
  }
  const L = {
    take(url, label, hint) { const p = started.get(url); if (p) { started.delete(url); return p; } return download(url, label, hint); },
    state(label, s) { const r = row(label); r.state = s; repaint(); },
    finish() { finished = true; paint(); document.getElementById('load').classList.add('done'); },
  };
  // what the page needs, in the order it's listed; the URLs must match the ones the module script asks for
  const MJ = 'https://cdn.jsdelivr.net/npm/@mujoco/mujoco@4.0.1/', ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';
  row('Page code').state = 'load';
  start(MJ + 'mujoco.wasm', 'Physics engine', 11201302);
  start(ORT + 'ort-wasm-simd-threaded.wasm', 'Brain engine', 14848852);
  // the brain the page will pick: ?model=<id>, else the one picked in Options, else the default (as in the module)
  start('body/models/index.json', 'Brain').then(buf => {
    const M = JSON.parse(new TextDecoder().decode(buf));
    let id = new URLSearchParams(location.search).get('model');
    if (!id) try { id = localStorage.getItem('thebox.model'); } catch (_) {}
    const m = M.models.find(x => x.id === id) || M.models.find(x => x.id === M.default) || M.models[0];
    start(m.dir + 'soma_tracker.json', 'Brain');
    start(m.dir + 'soma_tracker.onnx', 'Brain', m.onnx_bytes || 0);   // real size from the picker list (0: the server's)
  }, () => {});
  let fig = 'female';
  try { fig = localStorage.getItem('box.figure') || fig; } catch (_) {}
  const FIGF = { female: 'body/bodychan.glb', male: 'body/bodykun.glb' };   // = FIGS in the module
  if (FIGF[fig]) start(FIGF[fig] + '?v=' + encodeURIComponent(document.getElementById('ver').textContent), 'Figure');
  start('body/soma23_box.xml', 'Body');
  repaint();
  return L;
})();
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import loadMujoco from '@mujoco/mujoco';
import { BoxWorld, PHYS, BODY_FILE } from './sim/physics.js';
import { makeController, STAND } from './sim/control.js';
import * as ort from 'onnxruntime-web';
import { Brain, BRAIN_STAND, makeCalmGravity, qmul, qrot } from './sim/brain.js';
import { Director } from './sim/director.js';
import { POSES, applyPose } from './sim/poses.js';
import { buildLook, lookFromGLTF } from './sim/look.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;
const clamp = THREE.MathUtils.clamp;

// ================= settings (Options) =================
function pct(v) { return Math.round(v * 100) + '%'; }
const OPTS = [
  { grp: 'The figure' },
  { k: 'push', label: 'Finger push', min: 0, max: 2, step: 0.05, def: 1, fmt: pct, help: 'How hard your finger pushes him when you touch him.' },
  { grp: 'Moving the phone' },
  { k: 'shake', label: 'Shake strength', min: 0, max: 4, step: 0.05, def: 1.5, fmt: v => v.toFixed(2) + 'x', help: 'How much shaking the phone throws things about.' },
  { k: 'smooth', label: 'Sensor smoothing', min: 0, max: 0.95, step: 0.01, def: 0.5, fmt: pct, help: 'Higher is calmer, lower reacts faster.' },
  { k: 'view', label: 'View depth', min: 0, max: 1.5, step: 0.01, def: 0.3, fmt: pct, help: 'How much the view shifts as you turn the phone.' },
  { k: 'viewReturn', label: 'View re-centre', min: 0.5, max: 12, step: 0.1, def: 3, fmt: v => v.toFixed(1) + ' s', help: 'How fast the view settles back after you turn.' },
  { grp: 'Look and sound' },
  { k: 'hiQ', label: 'High detail', tog: true, def: false, help: 'Sharper picture and shadows. Slower on phones.' },
  { k: 'sound', label: 'Sound', tog: true, def: true, help: 'Footsteps, scuffs, hands on the wood, bumps and slides.' },
];
const SET = {};
const STORE = 'thebox.settings.v4';
function loadSettings() {
  for (const o of OPTS) if (o.k) SET[o.k] = o.def;
  try { Object.assign(SET, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (_) {}
}
function saveSettings() { try { localStorage.setItem(STORE, JSON.stringify(SET)); } catch (_) {} }
loadSettings();

// ================= renderer / scene =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const DARK = new THREE.Color(0x1a120b), ROOM = new THREE.Color(0x7d7368), GREY = new THREE.Color(0x808080);
scene.background = DARK;
const camera = new THREE.PerspectiveCamera();
scene.add(camera);

// ================= dimensions (world units; the screen's short side = 2) =================
const D = 2.34;      // box depth: room to turn round and get up
const LIP = 0.07;    // wall thickness at the rim
const EYE = 5.2;     // viewing distance
let hw, hh, ix, iy;

// ================= procedural wood =================
// Each board is drawn as a real cut through a log: the growth rings are cylinders around the pith, the board's face
// cuts them at a slight angle, so they show as nested arches ("cathedrals") with straight grain at the edges.
// Earlywood is light, latewood darker with a sharp edge into the next year's ring; fine pores run along the grain;
// knots push the rings round them. Drawn once per surface on the GPU, read back into a canvas (fast enough to redo
// when the screen turns). The same seed gives the same boards, so the wood doesn't change when the box is rebuilt.
const PX = 320;   // texels per world unit
const WOOD_SEED = Math.floor(Math.random() * 997);
const WOOD_GLSL = /* glsl */`
precision highp float;
uniform vec2 uSize; uniform float uPX, uAlong, uPlanks, uSeed, uMode, uSeams, uKnots, uTilt;
uniform vec3 uE, uL; uniform float uVar;
float h11(float p) { p = fract(p * .1031); p *= p + 33.33; p *= p + p; return fract(p); }
float h21(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vn(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 17.1; a *= .5; } return s - .47; }
void main() {

let actx = null;
// The figure's sounds: only when a part meets the wood, soft and muffled, like a person in a wooden box. A foot landing
// is a soft heel-then-sole step; a hand is a light pat; knees, elbows, head and body land with a dull thump (the

  let br = 0; for (let i = 0; i < len; i++) { br = 0.9 * br + 0.1 * (Math.random() * 2 - 1); d[i] = br * 2.5; }   // soft, dark noise

// the parts' touches on the wood, read from MuJoCo's contacts: a part sounds when it arrives on a wall
const SND_KIND = n => /Foot|ToeBase/.test(n) ? 'foot' : /Hand/.test(n) ? 'hand' : /Arm|Shin|Leg|Shoulder|Neck/.test(n) ? 'limb' : 'body';

function sfxUpdate(dt) {

  const vel = {};

    const b = W.bodyId[n], p = [d.xpos[3 * b], d.xpos[3 * b + 1], d.xpos[3 * b + 2]], q = prevPos[n];
    vel[n] = q && dt > 0 ? [(p[0] - q[0]) / dt, (p[1] - q[1]) / dt, (p[2] - q[2]) / dt] : [0, 0, 0];

  const touch = {};
  const isWall = g => W.isFig[m.geom_bodyid[g]] === 0;

    if (/ToeBase/.test(n)) n = n.replace('ToeBase', 'Foot');   // the foot speaks for the toes

  }

    else if (kind === 'limb') { weight(t, 90, 0.08, 0.08 * s2); soft(t, 0.07, 500, 0.15 * s2); }

  }
}

let acc = 0, last = performance.now(), frameN = 0;
const lu = new THREE.Vector3();
const calmG = makeCalmGravity();
async function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;

  // which way is down? (in g, screen axes; shakes included)
  let gx, gy, gz;
  if (mode === 'sensor' && !tiltOn) {
    gx = 0; gy = -1; gz = 0;
  } else if (mode === 'sensor') {
    gS.lerp(gRaw, 1 - Math.pow(SET.smooth, dt * 60));
    if (levelPending && (levelT += dt) > 0.4) { setLevel(gS); levelPending = false; }
    levelG(gS, gL);
    gx = gL.x; gy = gL.y; gz = gL.z;
  } else {
    const a = Math.min(1, dt * 10);
    dragS.roll += (dragRot.roll - dragS.roll) * a; dragS.pitch += (dragRot.pitch - dragS.pitch) * a;
    gx = Math.sin(dragS.roll) * Math.cos(dragS.pitch);
    gy = -Math.cos(dragS.roll) * Math.cos(dragS.pitch);
    gz = -Math.sin(dragS.pitch);
  }
  // real gravity, 9.81 m/s2, in MuJoCo's axes (x right, y into the box, z up)
  // calmed (sim/brain.js makeCalmGravity): the accelerometer's tremor and noise made him shuffle (user, v15.2)
  W.setGravity(calmG([gx * 9.81, -gz * 9.81, gy * 9.81], dt));
  // the room's light stays up
  const gl = Math.hypot(gx, gy, gz) || 1;
  lu.set(-gx / gl, -gy / gl, -gz / gl);
  lightUp.lerp(lu, Math.min(1, dt * 4)).normalize();
  placeLight();

  if (PLAY) { playRecording(dt); acc = 0; } else gaze(dt);
  // physics in real time, in small steps
  acc += (look.on || PLAY) ? 0 : dt;
  let n = 0;
  const nMax = Math.round(0.034 / PHYS.dt);
  while (acc >= PHYS.dt && n < nMax) {
    if (poke.on) poke.t += PHYS.dt;
    fingerPush();
    testKick();
    if (brain && control === brain.control && brain.due()) {
      await brain.think();   // the network, 30 times a second
      if (director) director.update(1 / 30);   // losing balance? switch to a real recovery recording
      if (brain.down && !brain.told) { brain.told = true; note("He can't get up on his own yet. Double-tap to stand him up.", 3500); }
    }
    W.step(control);
    AUDIT.check();
    acc -= PHYS.dt; n++;
  }
  if (n === nMax) acc = 0;   // a slow phone: let time slip rather than fall behind
  sfxUpdate(dt);
  syncFigure();

  if (look.on) lookCamera(); else updateCamera(dt);
  // bounce light: redrawn only when the light has moved
  frameN++;
  if (envDirty < 2 || (lightUp.angleTo(envUp) > 4 * DEG && frameN - envFrame > 12)) { updateEnv(); envDirty++; envUp.copy(lightUp); envFrame = frameN; }
  renderer.render(scene, camera);
  adaptSharpness(dt);
  requestAnimationFrame(frame);
}

// ================= "Recording only (no physics)" (user, Nov 13 09:26: "This is extremely far from anything remotely
// natural"). The baseline we never showed him: the real person's idle recording played straight onto the body, no
// physics, no brain, like a game animation. If this looks natural, the brain is the problem; if not, the body, the
// conversion of the recordings or the figure is. Picker entry with "playback": "<clip>". =================
let PLAY = null;
if (MODEL.playback) try {
  const buf = new Float32Array(await LOAD.take('body/clips/' + MODEL.playback + '.bin', 'Brain', 514368));
  const F = 376, n = Math.floor(buf.length / F), q0 = buf.subarray(299, 372);
  // turn it so frame 0's hips face the glass (body forward = its -y), and put frame 0's hips mid-box on the floor
  const qr = [q0[4], q0[5], q0[6], q0[3]], f = [0, 0, 0];
  qrot(qr, 0, 0, -1, 0, f, 0);
  const yaw = -Math.PI / 2 - Math.atan2(f[1], f[0]);
  PLAY = { buf, n, t: 0, yaw, q: [0, 0, Math.sin(yaw / 2), Math.cos(yaw / 2)], x0: q0[0], y0: q0[1] };
} catch (e) { console.warn('playback clip', e); }
function playRecording(dt) {
  const P = PLAY, d = W.d, F = 376, L = (P.n - 1) / 30;
  P.t += dt;
  const u = P.t % (2 * L), x = (u < L ? u : 2 * L - u) * 30, i = Math.min(P.n - 2, Math.floor(x)), w = x - i;
  const a = P.buf.subarray(i * F + 299, i * F + 372), b = P.buf.subarray((i + 1) * F + 299, (i + 1) * F + 372);
  for (let k = 7; k < 73; k++) d.qpos[k] = a[k] + (b[k] - a[k]) * w;
  const t = [0, 0, 0]; qrot(P.q, 0, a[0] + (b[0] - a[0]) * w - P.x0, a[1] + (b[1] - a[1]) * w - P.y0, 0, t, 0);
  d.qpos[0] = t[0]; d.qpos[1] = W.box.D / 2 + t[1]; d.qpos[2] = -W.box.h / 2 + a[2] + (b[2] - a[2]) * w;
  const s = (a[3] * b[3] + a[4] * b[4] + a[5] * b[5] + a[6] * b[6]) < 0 ? -1 : 1, c = [0, 0, 0, 0];
  for (let k = 0; k < 4; k++) c[k] = a[3 + k] * (1 - w) + s * b[3 + k] * w;   // w x y z
  const l = Math.hypot(...c), hq = [c[1] / l, c[2] / l, c[3] / l, c[0] / l], o = [0, 0, 0, 0];
  qmul(P.q, 0, hq, 0, o, 0);
  d.qpos[3] = o[3]; d.qpos[4] = o[0]; d.qpos[5] = o[1]; d.qpos[6] = o[2];
  for (let k = 0; k < d.qvel.length; k++) d.qvel[k] = 0;
  mj.mj_forward(W.m, d);
}

// ================= where he looks (user, Nov 13 01:26) =================
// "The character is always looking at us, unless they are losing balance. Then they look at the direction that they're
// going to fall into. Every once in a while [when idle] they look down on the floor and then back at you."
// The page only picks the point; the brain turns his real neck and head toward it (sim/brain.js applyLook).
const GZ = { pt: null, state: 'you', t: 0, next: 6 + Math.random() * 8, floor: null };
const _eye = new THREE.Vector3();
function gaze(dt) {
  if (!brain || look.on) return;
  const d = W.d, hips = W.bodyId.Hips, head = W.bodyId.Head, fl = W.bodyId.LeftFoot, fr = W.bodyId.RightFoot;
  const fz = -W.box.h / 2, mx = (d.xpos[3 * fl] + d.xpos[3 * fr]) / 2, my = (d.xpos[3 * fl + 1] + d.xpos[3 * fr + 1]) / 2;
  // you: the camera, in the box's frame
  figRoot.updateMatrixWorld(); _eye.copy(camera.position); figRoot.worldToLocal(_eye);
  const you = [_eye.x, _eye.y, _eye.z];
  // losing balance: hips moving fast, or his head well outside his feet
  const vx = d.qvel[0], vy = d.qvel[1], sp = Math.hypot(vx, vy);
  const hx = d.xpos[3 * head] - mx, hy = d.xpos[3 * head + 1] - my, lean = Math.hypot(hx, hy);
  let want;
  if (brain.down) want = null;
  else if (sp > 0.35 || lean > 0.22) {
    // where he is going: the way he moves, or the way he leans; the floor ~1.2 m out that way
    const ux = sp > 0.15 ? vx / sp : hx / (lean || 1), uy = sp > 0.15 ? vy / sp : hy / (lean || 1);
    want = [d.xpos[3 * hips] + ux * 1.2, d.xpos[3 * hips + 1] + uy * 1.2, fz];
    GZ.state = 'fall'; GZ.t = 0; GZ.next = 3 + Math.random() * 6;
  } else {
    GZ.t += dt;
    if (GZ.state === 'fall') GZ.state = 'you';
    if (GZ.state === 'you' && GZ.t > GZ.next) {   // a glance at the floor in front of him
      GZ.state = 'floor'; GZ.t = 0; GZ.dur = 1.0 + Math.random() * 1.2;
      GZ.floor = [mx + (Math.random() - 0.5) * 0.6, my - 0.6 - Math.random() * 0.4, fz];
    } else if (GZ.state === 'floor' && GZ.t > GZ.dur) { GZ.state = 'you'; GZ.t = 0; GZ.next = 6 + Math.random() * 10; }
    want = GZ.state === 'floor' ? GZ.floor : you;
  }
  if (!want) { brain.lookW = 0; return; }
  // the eyes lead, the head follows: the point moves there over ~0.25 s; toward a fall it snaps there (user 01:46:
  // "should be a fast turn")
  if (!GZ.pt) GZ.pt = want.slice();
  const k = 1 - Math.exp(-dt / (GZ.state === 'fall' ? 0.03 : 0.25));
  for (let i = 0; i < 3; i++) GZ.pt[i] += (want[i] - GZ.pt[i]) * k;
  brain.lookAt = GZ.pt; brain.lookW = 1;
}

// ================= start =================
$('go').onclick = async () => {
  goFull();
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); await actx.resume(); } catch (_) { actx = null; }
  for (const Ev of [window.DeviceOrientationEvent, window.DeviceMotionEvent]) {
    try { if (Ev && typeof Ev.requestPermission === 'function') await Ev.requestPermission(); } catch (_) {}
  }
  window.addEventListener('deviceorientation', onOrientation);
  window.addEventListener('devicemotion', onMotion);
  $('start').classList.add('hide');
  $('hud').classList.add('show');
  fullSync();
  setTimeout(() => { if (mode !== 'sensor') { mode = 'touch'; note('No motion sensors here, so drag to turn the box.', 4500); } }, 1300);
};

// a resize (the phone's bars, the address bar) only reshapes the box: he carries on where he is
let reshapeT = 0;
addEventListener('resize', () => { resizeAll(); clearTimeout(reshapeT); reshapeT = setTimeout(() => buildBox(), 250); });
// the room (wood textures baked on the graphics chip) takes a moment and blocks the page: show it as a loading step,
// let the screen paint it, then build; Start appears only when everything is ready (v15.21)
LOAD.state('Building the room', 'build');
await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
buildOptions();
buildBox();
buildFigure();
standUp();
applyQuality();
LOAD.state('Building the room', 'ready');
LOAD.finish();
$('go').disabled = false; $('go').textContent = 'Start';
requestAnimationFrame(frame);
</script>
