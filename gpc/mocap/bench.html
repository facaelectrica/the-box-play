<!doctype html>
<html><head><meta charset="utf-8"><title>TRACKER SPEED v1</title>
<style>body{margin:16px;font:14px/1.5 system-ui,sans-serif;background:#1b1612;color:#eee} td,th{padding:2px 12px 2px 0;text-align:left} th{color:#a99a8c;font-weight:600} .dim{color:#a99a8c}</style></head>
<body><b>TRACKER SPEED v1</b> <span class="dim">How long the rotation tracker's network takes on this computer, under different settings. No camera is used.</span>
<p id="st">Starting</p><table id="tb"><tr><th>Setting</th><th>Load (s)</th><th>First frame (ms)</th><th>Median (ms)</th><th>Slowest (ms)</th><th>Note</th></tr></table>
<script type="module">
const ORT = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/', HF = 'https://huggingface.co/momolesang/InstantHMR/resolve/main/', $ = id => document.getElementById(id), say = t => { $('st').textContent = t; };
const ort = await import(ORT + 'ort.webgpu.min.mjs'); ort.env.wasm.wasmPaths = ORT;
const only = new URLSearchParams(location.search).get('only'), results = []; window.__bench = { done: false, results };
const bufs = {}, get = async name => { if (bufs[name]) return bufs[name]; let cache = null; const url = HF + name;
  try { cache = await caches.open('record-models'); const hit = await cache.match(url); if (hit) return (bufs[name] = await hit.arrayBuffer()); } catch (_) {}
  say('Downloading ' + name); const r = await fetch(url); if (!r.ok) throw new Error(name + ' ' + r.status); const b = await r.arrayBuffer(); try { if (cache) await cache.put(url, new Response(b)); } catch (_) {} return (bufs[name] = b); };
const S = 288, x = new Float32Array(3 * S * S); for (let i = 0; i < x.length; i++) x[i] = Math.sin(i * 0.37) * 1.5;   // any picture: the time does not depend on what is in it
const row = r => { results.push(r); const tr = document.createElement('tr'); tr.innerHTML = [r.name, r.load, r.first, r.median, r.max, r.note || ''].map(v => `<td>${v ?? ''}</td>`).join(''); $('tb').appendChild(tr); };
async function run(name, model, opts, feedsOf) {
  if (only && !name.startsWith(only)) return; const r = { name };
  try { const buf = await get(model); say('Preparing: ' + name); const t0 = performance.now(), s = await ort.InferenceSession.create(buf, opts); r.load = +((performance.now() - t0) / 1000).toFixed(1);
    const ts = []; for (let i = 0; i < 40; i++) { const feeds = feedsOf(), a = performance.now(), out = await s.run(feeds); const v = out.mhr_params.data[5]; ts.push(performance.now() - a); if (i === 0) r.check = +v.toFixed(4); await new Promise(q => setTimeout(q, 0)); }
    r.first = Math.round(ts[0]); const rest = ts.slice(8).sort((a, b) => a - b); r.median = +rest[rest.length >> 1].toFixed(1); r.max = +rest.at(-1).toFixed(1); r.note = 'check value ' + r.check; await s.release(); }
  catch (e) { r.note = 'failed: ' + String(e && e.message || e).slice(0, 160); }
  row(r); }
const f32 = () => ({ image: new ort.Tensor('float32', x, [1, 3, S, S]), cliff_cond: new ort.Tensor('float32', new Float32Array([0.05, 0.02, 0.5]), [1, 3]) }), fixed = { batch: 1 };
await run('A medium, as the page runs it now', 'instanthmr-medium.onnx', { executionProviders: ['webgpu'], graphOptimizationLevel: 'all' }, f32);
await run('B medium, input size fixed', 'instanthmr-medium.onnx', { executionProviders: ['webgpu'], graphOptimizationLevel: 'all', freeDimensionOverrides: fixed }, f32);
await run('C medium, input size fixed, graph capture', 'instanthmr-medium.onnx', { executionProviders: ['webgpu'], graphOptimizationLevel: 'all', freeDimensionOverrides: fixed, enableGraphCapture: true }, f32);
await run('D nano, input size fixed', 'instanthmr-nano.onnx', { executionProviders: ['webgpu'], graphOptimizationLevel: 'all', freeDimensionOverrides: fixed }, f32);
await run('E small, input size fixed', 'instanthmr-small.onnx', { executionProviders: ['webgpu'], graphOptimizationLevel: 'all', freeDimensionOverrides: fixed }, f32);
await run('F medium on the CPU (wasm), input size fixed', 'instanthmr-medium.onnx', { executionProviders: ['wasm'], graphOptimizationLevel: 'all', freeDimensionOverrides: fixed }, f32);
say('Done. Cross-origin isolated: ' + self.crossOriginIsolated + ', cores: ' + navigator.hardwareConcurrency); window.__bench.done = true;
</script></body></html>
