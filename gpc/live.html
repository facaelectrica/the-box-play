// ================= dimensions (world units; the screen's short side = 2) =================
const D = 2.34;      // box depth: room to turn round and get up
const LIP = 0.07;    // wall thickness at the rim
const EYE = 5.2;     // viewing distance
let hw, hh, ix, iy;

// ================= procedural wood =================
// Each board is drawn as a real cut through a log: the growth rings are cylinders around the pith, the board's face
// cuts them at a slight angle, so they show as nested arches ("cathedrals") with straight grain at the edges.
// Earlywood is light, latewood darker with a sharp edge into the next year's ring; fine pores run along the grain;
// knots push the rings round them. Drawn once per surface on the GPU, read back into a canvas (fast enough to redo
// when the screen turns). The same seed gives the same boards, so the wood doesn't change when the box is rebuilt.
const PX = 320;   // texels per world unit
const WOOD_SEED = Math.floor(Math.random() * 997);
const WOOD_GLSL = /* glsl */`
precision highp float;
uniform vec2 uSize; uniform float uPX, uAlong, uPlanks, uSeed, uMode, uSeams, uKnots, uTilt;
uniform vec3 uE, uL; uniform float uVar;
float h11(float p) { p = fract(p * .1031); p *= p + 33.33; p *= p + p; return fract(p); }
float h21(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vn(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) { float a = .5, s = 0.; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 17.1; a *= .5; } return s - .47; }
void main() {
  vec2 c = gl_FragCoord.xy;   // read back bottom row first, so this is the canvas pixel, top row first
  vec2 b = (uAlong > .5 ? c : c.yx) / uPX;                           // board: x along the grain, y across
  float W = (uAlong > .5 ? uSize.y : uSize.x) / uPX, Lb = (uAlong > .5 ? uSize.x : uSize.y) / uPX;
  float pw = W / uPlanks, p = min(floor(b.y / pw), uPlanks - 1.), v = b.y - p * pw, u = b.x;
  float s = uSeed + p * 17.31;
  float r1 = h11(s + .1), r2 = h11(s + .2), r3 = h11(s + .3), r4 = h11(s + .4), r5 = h11(s + .5), r6 = h11(s + .6);
  // the log: pith beside/under the board, its depth below the face changing along the board (that makes the arches)
  float rf = mix(38., 58., r1);                                       // rings per unit
  float pc = pw * (.5 + (r2 - .5) * 1.3);
  float tilt = mix(.08, .18, r4) * uTilt;
  float along = r5 < .5 ? u : Lb - u;                                 // arches point up or down the board
  float uu = u + r6 * 40.;
  float dz = mix(.05, .55, r3 * r3) + tilt * along + .07 * sin(uu * .6 + r6 * 6.) + .08 * fbm(vec2(uu * .3, s));
  float dx = v - pc + .06 * fbm(vec2(uu * .45, v * 1.5 + s));
  float r = sqrt(dx * dx + dz * dz);
  r += .005 * fbm(vec2(uu * 1.5, v * 5. + s * 3.)) + .0012 * vn(vec2(uu * 10., v * 40.));
  // knots: the rings swell round them; a dark core with its own little rings
  float knot = 0.;
  for (int k = 0; k < 2; k++) {
    float q = s + float(k) * 3.7;
    if (h11(q + .7) > uKnots) continue;
    vec2 kp = vec2(h11(q + .8) * Lb, mix(.15, .85, h11(q + .9)) * pw);
    float ks = mix(.012, .028, h11(q + 1.1));
    vec2 d = (vec2(u, v) - kp) / vec2(ks * 4.5, ks * 1.7);
    r += mix(2.5, 5., h11(q + 1.3)) / rf * exp(-.5 * dot(d, d));
    float e = length((vec2(u, v) - kp) / vec2(ks * 1.25, ks));
    knot = max(knot, (1. - smoothstep(.6, 1.05, e)) * (.85 + .15 * sin(e * 12.)));
  }
  float x = r * rf, f = fract(x), id = floor(x);
  float ri = mix(.25, 1., pow(h11(id * 1.37 + s), 1.5));                          // some years darker than others
  float late = smoothstep(.55, .97, f); late *= late; late *= 1. - smoothstep(.975, 1., f);
  late *= ri;
  // pores and fibres, along the grain
  float por = vn(vec2(u * 3., v * 110.)), dash = smoothstep(.7, .95, vn(vec2(u * 7., v * 140.)));
  float big = fbm(vec2(u * .55, v * 1.6 + s));
  // seams between boards
  float de = min(v, pw - v) * uPX;
  float seam = 0., lip = 0.;
  if (uSeams > .5 && uPlanks > 1.) {
    bool inner = (v < pw * .5 && p > 0.) || (v >= pw * .5 && p < uPlanks - 1.);
    if (inner) { seam = 1. - smoothstep(.5, 1.6, de); lip = smoothstep(1.2, 2., de) * (1. - smoothstep(2., 5., de)); }
  }
  if (uMode > .5) {                                                    // height, for the bump map
    float hgt = .62 - .16 * late - .22 * dash - .1 * por + .08 * big - .25 * knot;
    hgt = mix(hgt, .05, seam) - .04 * lip;
    gl_FragColor = vec4(vec3(clamp(hgt, 0., 1.)), 1.);

  }

  vec3 E = uE * tint * (1. + .1 * (r4 - .5));
  vec3 L = uL * tint;
  vec3 col = mix(E, L, late * .75);
  col *= 1. + .18 * big;
  col *= 1. - .06 * por - .09 * dash * (.4 + late);
  col = mix(col, L * .5, knot * .85);
  col *= 1. - .78 * seam;
  col *= 1. - .1 * lip;
  gl_FragColor = vec4(clamp(col, 0., 1.), 1.);
}`;
const bakeCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), bakeScene = new THREE.Scene();
const bakeMat = new THREE.ShaderMaterial({
  vertexShader: 'void main() { gl_Position = vec4(position.xy, 0., 1.); }', fragmentShader: WOOD_GLSL, depthTest: false,
  uniforms: { uSize: { value: new THREE.Vector2() }, uPX: { value: PX }, uAlong: { value: 1 }, uPlanks: { value: 1 }, uSeed: { value: 0 },
    uMode: { value: 0 }, uSeams: { value: 1 }, uKnots: { value: .4 }, uTilt: { value: 1 }, uE: { value: new THREE.Color() }, uL: { value: new THREE.Color() }, uVar: { value: .1 } }
});
bakeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bakeMat));
function bakeWood(w, h, alongX, opt, mode) {
  const U = bakeMat.uniforms;
  U.uSize.value.set(w, h); U.uAlong.value = alongX ? 1 : 0; U.uPlanks.value = opt.planks || 1; U.uSeed.value = opt.seed || 0;
  U.uMode.value = mode; U.uSeams.value = opt.seams === false ? 0 : 1; U.uKnots.value = opt.knots ?? .4; U.uTilt.value = opt.tilt ?? 1;
  U.uE.value.setStyle(opt.light, THREE.NoColorSpace); U.uL.value.setStyle(opt.dark, THREE.NoColorSpace); U.uVar.value = opt.tintVar;

  renderer.setRenderTarget(rt); renderer.render(bakeScene, bakeCam);
  const buf = new Uint8ClampedArray(w * h * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, w, h, buf);
  renderer.setRenderTarget(prev); rt.dispose();

  c.getContext('2d').putImageData(new ImageData(buf, w, h), 0, 0);

}
// ao: corner darkening per edge, canvas orientation (top = the plane's +y)
function woodTexture(worldW, worldH, alongX, opt, ao) {
  const maxT = Math.min(4096, renderer.capabilities.maxTextureSize);
  const w = clamp(Math.round(worldW * PX), 64, maxT), h = clamp(Math.round(worldH * PX), 64, maxT);
  const bump = new THREE.CanvasTexture(bakeWood(w, h, alongX, opt, 1));
  const c = bakeWood(w, h, alongX, opt, 0), g = c.getContext('2d');
  const aoW = 0.28 * PX;
  const edge = (x0, y0, x1, y1, s, rx, ry, rw, rh) => {
    if (!s) return;
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    gr.addColorStop(0, `rgba(20,10,3,${s})`); gr.addColorStop(1, 'rgba(20,10,3,0)');
    g.fillStyle = gr; g.fillRect(rx, ry, rw, rh);
  };
  edge(0, 0, 0, aoW, ao.top, 0, 0, w, aoW);
  edge(0, h, 0, h - aoW, ao.bottom, 0, h - aoW, w, aoW);
  edge(0, 0, aoW, 0, ao.left, 0, 0, aoW, h);
  edge(w, 0, w - aoW, 0, ao.right, w - aoW, 0, aoW, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = bump.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return { map: tex, bump };
}

// honey-coloured oak, like the reference: light earlywood, orange-brown latewood
const WOOD = { light: '#dc7e1f', dark: '#a84c0b', tintVar: 0.1, knots: 0.45 };
const WALL = { ...WOOD, planks: 1 };
const BACK = { ...WOOD, planks: 3 };
const FLOOR = { ...WOOD, light: '#d27a22', dark: '#9c480c', planks: 1 };   // one board, like the reference
const RIM = { ...WOOD, light: '#d8802a', dark: '#a8500e', planks: 1, seams: false, knots: 0.15, tilt: 0.5 };
const seeded = (o, k) => ({ ...o, seed: WOOD_SEED + 101 * k });
function woodMat(t) {
  const m = new THREE.MeshStandardMaterial({ map: t.map, bumpMap: t.bump, bumpScale: 1.2, roughness: 0.74, metalness: 0 });
  m.envMapIntensity = 0.55;   // light bounced between the walls
  return m;
}

// ================= the box =================
let boxGroup = null;
const EDITOR = /[?&]editor/.test(location.search);
const roomView = () => EDITOR && window.__box && window.__box.worldView;
if (EDITOR) document.documentElement.classList.add('editor');
function buildBox() {
  const s = Math.min(innerWidth, innerHeight);
  hw = innerWidth / s; hh = innerHeight / s;
  if (EDITOR) { hw = 1; hh = 915 / 412; }   // the editor's box is always a phone's (Pixel-class, 412 x 915): the frame around it can be any shape
  ix = hw - LIP; iy = hh - LIP;
  if (boxGroup) {
    boxGroup.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.map?.dispose(); o.material.bumpMap?.dispose(); o.material.dispose(); } });
    scene.remove(boxGroup);
  }
  boxGroup = new THREE.Group(); scene.add(boxGroup);
  const longY = iy >= ix;
  const back = new THREE.Mesh(new THREE.PlaneGeometry(2 * ix, 2 * iy),
    woodMat(woodTexture(2 * ix, 2 * iy, !longY, seeded(BACK, 0), { top: .45, bottom: .45, left: .45, right: .45 })));
  back.position.z = -D; back.receiveShadow = true; boxGroup.add(back);
  const deep = .5, side = .34;
  const left = new THREE.Mesh(new THREE.PlaneGeometry(D, 2 * iy), woodMat(woodTexture(D, 2 * iy, false, seeded(WALL, 1), { right: deep, top: side, bottom: side })));
  left.rotation.y = Math.PI / 2; left.position.set(-ix, 0, -D / 2);
  const right = new THREE.Mesh(new THREE.PlaneGeometry(D, 2 * iy), woodMat(woodTexture(D, 2 * iy, false, seeded(WALL, 2), { left: deep, top: side, bottom: side })));
  right.rotation.y = -Math.PI / 2; right.position.set(ix, 0, -D / 2);
  const bottom = new THREE.Mesh(new THREE.PlaneGeometry(2 * ix, D), woodMat(woodTexture(2 * ix, D, true, seeded(FLOOR, 3), { top: deep, left: side, right: side })));
  bottom.rotation.x = -Math.PI / 2; bottom.position.set(0, -iy, -D / 2);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(2 * ix, D), woodMat(woodTexture(2 * ix, D, true, seeded(WALL, 4), { bottom: deep, left: side, right: side })));
  top.rotation.x = Math.PI / 2; top.position.set(0, iy, -D / 2);
  for (const w of [left, right, bottom, top]) { w.receiveShadow = true; boxGroup.add(w); }
  // the rim (the walls' top edge), flush with the screen
  const shape = new THREE.Shape();
  shape.moveTo(-hw - .01, -hh - .01); shape.lineTo(hw + .01, -hh - .01); shape.lineTo(hw + .01, hh + .01); shape.lineTo(-hw - .01, hh + .01); shape.closePath();
  const hole = new THREE.Path();
  hole.moveTo(-ix, -iy); hole.lineTo(-ix, iy); hole.lineTo(ix, iy); hole.lineTo(ix, -iy); hole.closePath();
  shape.holes.push(hole);
  const rimGeo = new THREE.ShapeGeometry(shape);
  const uv = rimGeo.attributes.uv, pos = rimGeo.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + hw) / (2 * hw), (pos.getY(i) + hh) / (2 * hh));
  const rt = woodTexture(2 * hw, 2 * hh, true, seeded(RIM, 5), {});
  const rim = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({ map: rt.map, bumpMap: rt.bump, bumpScale: 1, roughness: .7, emissive: 0x2a1a0c, emissiveIntensity: .45 }));
  rim.material.envMapIntensity = .4;
  boxGroup.add(rim);
  physBox();
  envDirty = 0;
}

// ================= lights =================
// one soft key light from the room, always from real "up" and in front of the glass
const spot = new THREE.SpotLight(0xfff0dc, 70, 0, 0.6, 0.65, 2);
spot.castShadow = true;
spot.shadow.bias = -0.0004;
spot.shadow.normalBias = 0.02;
scene.add(spot, spot.target);
scene.add(new THREE.HemisphereLight(0xfff2e0, 0x3a2410, 0.12));
const lightUp = new THREE.Vector3(0, 1, 0);
// open floor: the view (and the key light with it) pans sideways to follow him (user 14:58); 0 in the box
let camPan = 0, camRise = 0, camDepth = 0, standHipY = 0; const _panV = new THREE.Vector3();
// open floor: where the view and light follow him to (x across, depth along the floor), smoothed over 0.08 s. The aim
// allows for where the screen's middle really is: the eye's sideways shift (phone tilt, drag) and the pinch-zoom
// centre both move it, so the camera is placed so that his hips land in the middle of the screen. His hips never leave
// the middle 40% of the screen even if he moves faster than the camera. The height stays at his standing hips, so the
// floor never moves on screen (user Nov 17 07:23, 07:26, 07:58, 08:20)
function followHim(dt, ex = 0) { const on = place === 'floor', p = on ? bodyPoint('Hips', _panV) : null, a = 1 - Math.exp(-dt / (on ? 0.08 : 0.5));
  // his hips' depth behind the screen's plane and, from that, where they must be (across, from the view's centre line)
  // for the ray from the eye through the screen's middle to meet them
  const behind = on ? Math.max(0.2, camDepth - p.z) : 0, off = on ? ex + (zoomC.x - ex) * (EYE + behind) / EYE : 0;
  camPan += ((on ? p.x - off : 0) - camPan) * a; camRise += ((on ? standHipY : 0) - camRise) * a; camDepth += ((on ? p.z + D / 2 : 0) - camDepth) * a;
  if (!on) return;
  const half = 0.4 * (hw / zoom) * (EYE + behind) / EYE;   // 40% of half the view's width at his depth
  camPan = Math.min(p.x - off + half, Math.max(p.x - off - half, camPan));
  // the floor never ends: the picture's floor and the physics floor move with him in whole grid squares
  if (floorGroup) floorGroup.position.set(Math.round(camPan / S) * S, 0, Math.round(camDepth / S) * S);
  try { const b = W.bodyId.Hips, x = W.d.xpos[3 * b], y = W.d.xpos[3 * b + 1]; W.openAt(x, y); if (G !== W) G.openAt(x, y); } catch (_) {}
}
// (user 09:30: "when we are in pause mode and I rotate the camera, the lighting always respects the camera, so I can
// examine the model and always have a nice top-down lighting") paused: the key light rides with the camera, above and a
// little in front of it, aimed at what the camera looks at
let lookLight = null;
function placeLight() {
  if (lookLight) { lookLight(); return; }
  const dir = new THREE.Vector3(lightUp.x * 0.75, lightUp.y * 0.75, 0.85);
  if (dir.z < 0.55) dir.z = 0.55;
  dir.normalize();
  const dist = 4.6;
  spot.position.set(dir.x * dist + camPan, dir.y * dist + camRise, -D / 2 + dir.z * dist + camDepth);
  spot.target.position.set(camPan, camRise, -D * 0.7 + camDepth);
  spot.angle = Math.atan((Math.max(hw, hh) + 0.4) / dist) + 0.12;

// ================= the loop =================
let acc = 0, last = performance.now(), frameN = 0;
const lu = new THREE.Vector3();
const calmG = makeCalmGravity();
// ---- freeze guards (helper F, Nov 15; user: "the figure froze while the menu still worked") ----
// The loop asked for its next frame only at the very end of frame(): one exception anywhere in it (MuJoCo's wasm
// out of memory - see sim/physics.js freeContactCopies - a NaN in his body, a bug in a rare state) and no frame came
// again: the figure stood still, the buttons (plain page) still worked. Now: the next frame is always asked for, the
// problem is kept (last 20, in snapshots as `errors`), a body gone NaN/Infinity is stood up again, an exception that
// keeps coming back resets him, and a frame waiting over 4 s on something that never comes back is left behind.
const ERRS = [];

    msg: e ? String((e && e.message) || e).slice(0, 200) : undefined, stack: e && e.stack ? String(e.stack).split('\n').slice(0, 4).join(' | ').slice(0, 400) : undefined };
  const p = ERRS[ERRS.length - 1];

}
const allFinite = a => { for (let i = 0; i < a.length; i++) if (!Number.isFinite(a[i])) return false; return true; };
function bodyOK() { return allFinite(W.d.qpos) && allFinite(W.d.qvel) && (G === W || allFinite(G.d.qpos)); }
let loopGen = 0, frameT0 = 0, frameBusy = false, failRun = 0;
// ---- battery (V39; user Nov 15 12:25: "optimizations ... to help preserve phone battery, performance") ----
// - paused (look mode) nothing moves unless you touch the screen: the picture is drawn only when the view changes or
//   in the 0.7 s after a touch/button/turn of the phone, instead of 60-120 times a second
// - phones with 90-144 Hz screens asked for a frame up to 144 times a second: the whole page (his drawing, shadows) ran
//   twice for the same 60 frames people see in games; now at most ~1 frame per 10 ms (120 Hz -> 60, 90 Hz stays 90).
//   Options > High detail lifts the cap (the screen's full rate). His physics runs the same number of steps a second
//   either way (480 a second, each frame steps for the time since the last one).
let drawnAt = -1e9, lookSig = '', wakeUntil = 0, lookDrawn = -1e9;

for (const ev of ['pointerdown', 'pointermove', 'pointerup', 'click', 'wheel', 'keydown', 'resize', 'orientationchange', 'visibilitychange'])
  addEventListener(ev, wake, { capture: true, passive: true });

  } catch (e) {

async function frameStep(now) {

    levelG(gS, gL);
    gx = gL.x; gy = gL.y; gz = gL.z;
    // until the held angle has been taken as level (0.4 s after a start or reset), down is straight down: the raw angle
    // you hold the phone at read as a 30-50 deg slope and he fell over at once (phone test, version 6)

let PLAY = null;
if (false) try {
  const buf = new Float32Array(await LOAD.take('body/clips/' + MODEL.playback + '.bin', 'Brain', 514368));
  const F = 376, n = Math.floor(buf.length / F), q0 = buf.subarray(299, 372);
  // turn it so frame 0's hips face the glass (body forward = its -y), and put frame 0's hips mid-box on the floor
  const qr = [q0[4], q0[5], q0[6], q0[3]], f = [0, 0, 0];

function playRecording(dt) {
  const P = PLAY, d = W.d, F = 376, L = (P.n - 1) / 30;
  P.t += dt;
  const u = P.t % (2 * L), x = (u < L ? u : 2 * L - u) * 30, i = Math.min(P.n - 2, Math.floor(x)), w = x - i;
  const a = P.buf.subarray(i * F + 299, i * F + 372), b = P.buf.subarray((i + 1) * F + 299, (i + 1) * F + 372);

  const t = [0, 0, 0]; qrot(P.q, 0, a[0] + (b[0] - a[0]) * w - P.x0, a[1] + (b[1] - a[1]) * w - P.y0, 0, t, 0);
  d.qpos[0] = t[0]; d.qpos[1] = W.box.D / 2 + t[1]; d.qpos[2] = -W.box.h / 2 + a[2] + (b[2] - a[2]) * w;
  const s = (a[3] * b[3] + a[4] * b[4] + a[5] * b[5] + a[6] * b[6]) < 0 ? -1 : 1, c = [0, 0, 0, 0];

// ================= where he looks (user, Nov 13 01:26) =================
// "The character is always looking at us, unless they are losing balance. Then they look at the direction that they're
// going to fall into. Every once in a while [when idle] they look down on the floor and then back at you."
// The page only picks the point; the brain turns his real neck and head toward it (sim/brain.js applyLook).
const GZ = { pt: null, state: 'you', t: 0, next: 6 + Math.random() * 8, floor: null };
const _eye = new THREE.Vector3();
function gaze(dt) {
  if (!brain || look.on) return;
  const d = W.d, hips = W.bodyId.Hips, head = W.bodyId.Head, fl = W.bodyId.LeftFoot, fr = W.bodyId.RightFoot;
  const fz = -W.box.h / 2, mx = (d.xpos[3 * fl] + d.xpos[3 * fr]) / 2, my = (d.xpos[3 * fl + 1] + d.xpos[3 * fr + 1]) / 2;
  // you: the camera, in the box's frame

    const ux = sp > 0.15 ? vx / sp : hx / (lean || 1), uy = sp > 0.15 ? vy / sp : hy / (lean || 1);
    want = [d.xpos[3 * hips] + ux * 1.2, d.xpos[3 * hips + 1] + uy * 1.2, fz];

      GZ.state = 'floor'; GZ.t = 0; GZ.dur = 1.0 + Math.random() * 1.2;
      GZ.floor = [mx + (Math.random() - 0.5) * 0.6, my - 0.6 - Math.random() * 0.4, fz];
    } else if (GZ.state === 'floor' && GZ.t > GZ.dur) { GZ.state = 'you'; GZ.t = 0; GZ.next = 6 + Math.random() * 10; }

  if (!GZ.pt) GZ.pt = want.slice();
